<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello Neighbour 2D — the neighbour learns</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070a0f; color: #dfe8f2;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 900 / 620)); height: auto;
    aspect-ratio: 900 / 620; background: #070a0f; border-radius: 10px;
    box-shadow: 0 24px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05);
    image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  #hint { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; color: rgba(160,176,196,.45); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="900" height="620"></canvas></div>
<div id="hint">single file · no assets · procedural house · he learns between attempts</div>
<script>

/* ===== world.js ===== */
'use strict';
/* =====================================================================
   world.js — procedural house generator
   ---------------------------------------------------------------------
   Three floors, BSP rooms, guaranteed-connected door graph, deliberate
   loops, wall furniture, windows on real exterior walls, a yard shed and
   a locked cellar. Every structure is validated before it is accepted:
   a seed either yields a *provably* solvable house or is regenerated.
   ===================================================================== */

const MW = 48, MH = 36;
const HOUSE = { x: 9, y: 3, w: 28, h: 25 };
const BASE = { x: 13, y: 7, w: 19, h: 15 };

/* tile alphabet
   '#' wall   '.' floor   ',' grass   'F' fence/void   'S' furniture
   'W' window 'w' broken  'X' boarded 'D' door  'L' lock  'B' cellar lock
   'U' stairs up  'N' stairs down  'V' vault floor  'P' porch
*/
const SOLID = { '#': 1, F: 1, S: 1, W: 1, X: 1 };
const OPAQUE = { '#': 1, F: 1, S: 1, W: 1, X: 1 };

function mulberry(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (rng, arr) => arr[(rng() * arr.length) | 0];
const irnd = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

function mkGrid(fill) {
  const G = [];
  for (let y = 0; y < MH; y++) G.push(new Array(MW).fill(fill));
  return G;
}
function fillRect(G, x, y, w, h, ch) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (G[j] && G[j][i] !== undefined) G[j][i] = ch;
}
function borderRect(G, x, y, w, h, ch) {
  for (let i = x; i < x + w; i++) { if (G[y]) G[y][i] = ch; if (G[y + h - 1]) G[y + h - 1][i] = ch; }
  for (let j = y; j < y + h; j++) { if (G[j]) { G[j][x] = ch; G[j][x + w - 1] = ch; } }
}
function eachRect(x, y, w, h, fn) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) fn(i, j);
}

/* ------------------------------------------------------------ BSP rooms */
function bsp(x, y, w, h, depth, rng) {
  const node = { x, y, w, h };
  const canV = w >= 13, canH = h >= 13;
  if (depth <= 0 || (!canV && !canH)) return node;
  let vertical;
  if (canV && canH) vertical = w > h + 1 ? true : h > w + 1 ? false : rng() < 0.5;
  else vertical = canV && !canH;
  const size = vertical ? w : h;
  const cut = 6 + Math.floor(rng() * (size - 12 + 1));
  node.axis = vertical ? 'v' : 'h';
  node.cut = (vertical ? x : y) + cut;
  if (vertical) {
    node.a = bsp(x, y, cut, h, depth - 1, rng);
    node.b = bsp(x + cut, y, w - cut, h, depth - 1, rng);
  } else {
    node.a = bsp(x, y, w, cut, depth - 1, rng);
    node.b = bsp(x, y + cut, w, h - cut, depth - 1, rng);
  }
  return node;
}
function leavesOf(node, out) {
  out = out || [];
  if (!node.axis) out.push(node); else { leavesOf(node.a, out); leavesOf(node.b, out); }
  return out;
}

/* Carve a 2-cell-thick door through the wall between two sibling partitions.
   Because interiors are inset by one from their partition, both sides are
   guaranteed to be floor at the chosen coordinate — no guessing. */
function connectTree(G, node, doors, rng) {
  if (!node.axis) return;
  connectTree(G, node.a, doors, rng);
  connectTree(G, node.b, doors, rng);
  const vertical = node.axis === 'v';
  const cut = node.cut;
  const lo = vertical ? node.y + 1 : node.x + 1;
  const hi = vertical ? node.y + node.h - 2 : node.x + node.w - 2;
  const cand = [];
  for (let t = lo; t <= hi; t++) {
    const a = vertical ? G[t][cut - 2] : G[cut - 2][t];
    const b = vertical ? G[t][cut + 1] : G[cut + 1][t];
    if (a === '.' && b === '.') {
      // prefer positions away from existing doors
      let near = 0;
      for (const d of doors) for (const c of d.cells) if (Math.abs(c[0] - (vertical ? cut : t)) + Math.abs(c[1] - (vertical ? t : cut)) < 4) near++;
      cand.push({ t, near });
    }
  }
  if (!cand.length) return;
  const clean = cand.filter((c) => c.near === 0);
  const spot = pick(rng, clean.length ? clean : cand);
  const cells = [];
  if (vertical) {
    cells.push([cut - 1, spot.t], [cut, spot.t]);
    G[spot.t][cut - 1] = 'D'; G[spot.t][cut] = 'D';
  } else {
    cells.push([spot.t, cut - 1], [spot.t, cut]);
    G[cut - 1][spot.t] = 'D'; G[cut][spot.t] = 'D';
  }
  doors.push({ cells, axis: vertical ? 'v' : 'h', closed: 1, kind: 'door' });
}

/* --------------------------------------------------- room adjacency graph
   Every pair of leaves that shares a wall gets a potential door slot. A
   spanning tree over that graph guarantees connectivity; extra edges are
   added as loops so the house has more than one route (essential for both
   stealth routes and the neighbour's cut-offs). */
function sharedWall(a, b) {
  if (a.x + a.w === b.x || b.x + b.w === a.x) {
    const left = a.x < b.x ? a : b, right = a.x < b.x ? b : a;
    const lo = Math.max(left.y + 1, right.y + 1);
    const hi = Math.min(left.y + left.h - 2, right.y + right.h - 2);
    if (hi >= lo) return { axis: 'v', ax: left.x + left.w - 1, bx: right.x, lo, hi };
  }
  if (a.y + a.h === b.y || b.y + b.h === a.y) {
    const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
    const lo = Math.max(top.x + 1, bot.x + 1);
    const hi = Math.min(top.x + top.w - 2, bot.x + bot.w - 2);
    if (hi >= lo) return { axis: 'h', ay: top.y + top.h - 1, by: bot.y, lo, hi };
  }
  return null;
}

function roomDegree(room, doors) {
  let n = 0;
  for (const d of doors) {
    let near = false;
    for (const c of d.cells)
      for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
        const x = c[0] + dx, y = c[1] + dy;
        if (x >= room.x + 1 && x <= room.x + room.iw && y >= room.y + 1 && y <= room.y + room.ih && Math.abs(dx) <= 2 && Math.abs(dy) <= 2) near = true;
      }
    if (near) n++;
  }
  return n;
}

function carveDoor(G, edge, t, doors, rng) {
  if (edge.axis === 'v') {
    if (G[t][edge.ax] !== '#' || G[t][edge.bx] !== '#') return null;
    G[t][edge.ax] = 'D'; G[t][edge.bx] = 'D';
    const d = { cells: [[edge.ax, t], [edge.bx, t]], axis: 'v', closed: 1, kind: 'door' };
    doors.push(d); return d;
  }
  if (G[edge.ay][t] !== '#' || G[edge.by][t] !== '#') return null;
  G[edge.ay][t] = 'D'; G[edge.by][t] = 'D';
  const d = { cells: [[t, edge.ay], [t, edge.by]], axis: 'h', closed: 1, kind: 'door' };
  doors.push(d); return d;
}

function connectLeaves(G, leaves, doors, rng, loopChance) {
  const edges = [];
  for (let i = 0; i < leaves.length; i++)
    for (let j = i + 1; j < leaves.length; j++) {
      const e = sharedWall(leaves[i], leaves[j]);
      if (e) edges.push({ i, j, e });
    }
  const parent = leaves.map((_, i) => i);
  const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const union = (a, b) => { a = find(a); b = find(b); if (a === b) return false; parent[a] = b; return true; };

  const shuffled = edges.slice().sort(() => rng() - 0.5);
  const used = new Set();
  let carved = 0;
  for (const { i, j, e } of shuffled) {
    if (!union(i, j)) continue;
    // try door positions, biased away from other doors
    const slots = [];
    for (let t = e.lo; t <= e.hi; t++) {
      let near = 0;
      for (const d of doors) for (const c of d.cells) {
        const dx = Math.abs(c[0] - (e.axis === 'v' ? e.ax : t));
        const dy = Math.abs(c[1] - (e.axis === 'v' ? t : e.ay));
        if (dx + dy < 4) near++;
      }
      slots.push({ t, near });
    }
    slots.sort((a, b) => a.near - b.near || rng() - 0.5);
    for (const slot of slots) {
      const d = carveDoor(G, e, slot.t, doors, rng);
      if (d) { used.add(i + ':' + j); carved++; break; }
    }
  }
  // loops: shared walls that were not needed for connectivity
  const extra = edges.filter(({ i, j }) => !used.has(i + ':' + j));
  for (const { i, j, e } of extra) {
    if (rng() > (loopChance == null ? 0.22 : loopChance)) continue;
    const slots = [];
    for (let t = e.lo; t <= e.hi; t++) {
      let near = 0;
      for (const d of doors) for (const c of d.cells) if (Math.abs(c[0] - (e.axis === 'v' ? e.ax : t)) + Math.abs(c[1] - (e.axis === 'v' ? t : e.ay)) < 5) near++;
      slots.push({ t, near });
    }
    slots.sort((a, b) => a.near - b.near || rng() - 0.5);
    for (const slot of slots) {
      if (carveDoor(G, e, slot.t, doors, rng)) break;
    }
  }
  return carved;
}

/* ------------------------------------------------------------- windows */
function addWindows(G, floorIdx, rect, doors, rng) {
  const wins = [];
  const doorCells = new Set();
  for (const d of doors) for (const c of d.cells) doorCells.add(c[0] + ',' + c[1]);
  const tryCell = (x, y, ix, iy) => {
    if (G[y][x] !== '#') return;
    if (doorCells.has(x + ',' + y)) return;
    if (G[iy] === undefined || G[iy][ix] !== '.') return;
    if (rng() < 0.34) { G[y][x] = 'W'; wins.push({ x, y, z: floorIdx, ix, iy }); }
  };
  for (let x = rect.x + 2; x < rect.x + rect.w - 2; x++) {
    tryCell(x, rect.y, x, rect.y + 1);
    tryCell(x, rect.y + rect.h - 1, x, rect.y + rect.h - 2);
  }
  for (let y = rect.y + 2; y < rect.y + rect.h - 2; y++) {
    tryCell(rect.x, y, rect.x + 1, y);
    tryCell(rect.x + rect.w - 1, y, rect.x + rect.w - 2, y);
  }
  return wins;
}

/* --------------------------------------------------------- room themes */
const THEMES = {
  kitchen: [{ k: 'counter', w: 3, h: 1 }, { k: 'stove', w: 2, h: 1 }, { k: 'sink', w: 2, h: 1 }, { k: 'fridge', w: 1, h: 1, box: 1 }, { k: 'table', w: 2, h: 2 }],
  living: [{ k: 'couch', w: 3, h: 1 }, { k: 'tv', w: 2, h: 1 }, { k: 'table', w: 2, h: 2 }, { k: 'shelf', w: 3, h: 1 }, { k: 'lamp', w: 1, h: 1 }],
  bedroom: [{ k: 'bed', w: 2, h: 3 }, { k: 'wardrobe', w: 2, h: 1 }, { k: 'nightstand', w: 1, h: 1 }, { k: 'dresser', w: 2, h: 1 }],
  study: [{ k: 'desk', w: 2, h: 1, box: 1 }, { k: 'bookshelf', w: 3, h: 1 }, { k: 'chair', w: 1, h: 1 }, { k: 'cabinet', w: 1, h: 1 }],
  bathroom: [{ k: 'tub', w: 3, h: 1 }, { k: 'toilet', w: 1, h: 1 }, { k: 'basin', w: 1, h: 1 }, { k: 'cabinet', w: 1, h: 1 }],
  workshop: [{ k: 'bench', w: 3, h: 1 }, { k: 'rack', w: 2, h: 1 }, { k: 'crate', w: 1, h: 1 }],
  hall: [{ k: 'table', w: 2, h: 1 }, { k: 'cabinet', w: 1, h: 1 }],
  vault: [{ k: 'shelf', w: 3, h: 1 }, { k: 'crate', w: 1, h: 1 }],
};
const ROOM_TYPES = ['living', 'kitchen', 'bedroom', 'bathroom', 'study', 'workshop', 'hall'];

function insideRoom(r, x, y, pad) {
  pad = pad || 0;
  return x >= r.x + pad && x < r.x + r.w - pad && y >= r.y + pad && y < r.y + r.h - pad;
}

/* Place furniture along walls, refusing anything that would cut a room in
   two. Every candidate is validated by a flood fill before it is kept. */
function furnish(G, rooms, doors, rng, floorIdx) {
  const junk = [];
  const doorNear = new Set();
  for (const d of doors)
    for (const c of d.cells)
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++) doorNear.add((c[0] + dx) + ',' + (c[1] + dy));

  const freeCell = (x, y) => {
    if (G[y] === undefined) return false;
    const c = G[y][x];
    return c === '.' && !doorNear.has(x + ',' + y);
  };

  for (const r of rooms) {
    const theme = THEMES[r.type] || THEMES.hall;
    const want = Math.max(2, Math.min(5, Math.floor((r.iw * r.ih) / 14)));
    let placed = 0;
    for (let attempt = 0; attempt < want * 8 && placed < want; attempt++) {
      const proto = pick(rng, theme);
      const w = proto.w, h = proto.h;
      const horizontal = rng() < 0.5;
      const fw = horizontal ? w : h, fh = horizontal ? h : w;
      // hug a wall: pick an edge, then a position along it
      const edge = irnd(rng, 0, 3);
      let x, y;
      const xMax = r.x + r.iw - fw + 1, yMax = r.y + r.ih - fh + 1;
      if (edge === 0) { x = irnd(rng, r.x + 1, Math.max(r.x + 1, xMax)); y = r.y + 1; }
      else if (edge === 1) { x = irnd(rng, r.x + 1, Math.max(r.x + 1, xMax)); y = yMax; }
      else if (edge === 2) { x = r.x + 1; y = irnd(rng, r.y + 1, Math.max(r.y + 1, yMax)); }
      else { x = xMax; y = irnd(rng, r.y + 1, Math.max(r.y + 1, yMax)); }
      if (x < r.x + 1 || y < r.y + 1) continue;
      if (x + fw - 1 > r.x + r.iw || y + fh - 1 > r.y + r.ih) continue;
      let ok = true;
      for (let j = y; j < y + fh && ok; j++)
        for (let i = x; i < x + fw; i++) if (!freeCell(i, j)) { ok = false; break; }
      if (!ok) continue;
      // keep at least one free ring around every piece -> never a seal
      const saved = [];
      for (let j = y; j < y + fh; j++) for (let i = x; i < x + fw; i++) { saved.push([i, j, G[j][i]]); G[j][i] = 'S'; }
      if (!roomConnected(G, r)) { for (const s of saved) G[s[1]][s[0]] = s[2]; continue; }
      junk.push({ k: proto.k, x, y, w: fw, h: fh, z: floorIdx, room: r.id, box: proto.box || 0 });
      placed++;
      if (proto.box === 1) r.box = junk[junk.length - 1];
    }
  }
  return junk;
}

function roomConnected(G, r) {
  // flood fill the room interior; every '.' interior cell must be reachable
  const cells = [];
  for (let y = r.y + 1; y <= r.y + r.ih; y++) for (let x = r.x + 1; x <= r.x + r.iw; x++) if (G[y][x] === '.') cells.push([x, y]);
  if (cells.length < 2) return true;
  const seen = new Set([cells[0][0] + ',' + cells[0][1]]);
  const q = [cells[0]];
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (seen.has(k) || G[ny] === undefined) continue;
      const c = G[ny][nx];
      if (c !== '.' && c !== 'D' && c !== 'U' && c !== 'N' && c !== 'V') continue;
      if (nx < r.x + 1 || nx > r.x + r.iw || ny < r.y + 1 || ny > r.y + r.ih) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return seen.size >= cells.length;
}

/* --------------------------------------------------------------- floors */
function mkFloor(z, name, fill) {
  return { z, name, G: mkGrid(fill), rooms: [], furniture: [], lights: [], windows: [] };
}

function makeRooms(leaves, G, floorIdx, rng) {
  const rooms = [];
  let id = 0;
  for (const l of leaves) {
    const r = {
      id: floorIdx + ':' + id++, z: floorIdx,
      x: l.x, y: l.y, w: l.w, h: l.h,
      iw: l.w - 2, ih: l.h - 2,
      cx: l.x + l.w / 2, cy: l.y + l.h / 2,
      type: 'hall', name: 'Room',
    };
    rooms.push(r);
  }
  return rooms;
}

/* Assign functional room types. Kitchen and study are mandatory, because
   the red key lives in the fridge and the blue key in the desk. */
function assignTypes(rooms, rng, order) {
  const big = rooms.slice().sort((a, b) => b.iw * b.ih - a.iw * a.ih);
  const used = new Set();
  const out = {};
  for (const type of order) {
    const min = type === 'bathroom' ? [4, 3] : type === 'hall' ? [2, 2] : [5, 4];
    const r = big.find((q) => !used.has(q.id) && q.iw >= min[0] && q.ih >= min[1]);
    if (r) { r.type = type; used.add(r.id); out[type] = r; }
  }
  for (const r of rooms) if (!used.has(r.id)) { r.type = 'hall'; }
  return out;
}

/* ---------------------------------------------------------------- yard */
function buildYard(G, rng, doors) {
  // fence ring
  for (let x = 1; x < MW - 1; x++) { G[1][x] = 'F'; G[MH - 2][x] = 'F'; }
  for (let y = 1; y < MH - 1; y++) { G[y][1] = 'F'; G[y][MW - 2] = 'F'; }
  // gate at the bottom
  const gateX = 15 + irnd(rng, 0, 16);
  G[MH - 2][gateX] = ','; G[MH - 2][gateX + 1] = ',';

  // shed — 6x5, chosen from spots that cannot collide with the house
  const sw = 6, sh = 5;
  const spots = [
    { x: 2, y: 7 }, { x: 2, y: 27 }, { x: MW - 3 - sw, y: 7 }, { x: MW - 3 - sw, y: 27 },
    { x: 3, y: 12 }, { x: MW - 4 - sw, y: 14 },
  ].filter((c) => {
    if (c.x < 2 || c.y < 2 || c.x + sw > MW - 2 || c.y + sh > MH - 2) return false;
    const pad = 1;
    const overlap = c.x < HOUSE.x + HOUSE.w + pad && c.x + sw > HOUSE.x - pad &&
                    c.y < HOUSE.y + HOUSE.h + pad && c.y + sh > HOUSE.y - pad;
    return !overlap;
  });
  if (!spots.length) return null;
  const c = pick(rng, spots);
  const sx = c.x, sy = c.y;
  fillRect(G, sx, sy, sw, sh, ',');
  borderRect(G, sx, sy, sw, sh, '#');
  fillRect(G, sx + 1, sy + 1, sw - 2, sh - 2, '.');
  // door on the side facing the house
  const east = sx + sw / 2 < MW / 2;
  const dy = sy + 1 + irnd(rng, 0, sh - 3);
  const dx = east ? sx + sw - 1 : sx;
  G[dy][dx] = 'D';
  doors.push({ cells: [[dx, dy]], axis: 'v', closed: 0, kind: 'door', shed: 1, z: 0 });
  const interior = [];
  for (let y = sy + 1; y < sy + sh - 1; y++) for (let x = sx + 1; x < sx + sw - 1; x++) interior.push([x, y]);
  return { x: sx, y: sy, w: sw, h: sh, interior, gate: { x: gateX, y: MH - 2 } };
}

/* -------------------------------------------------------------- stairs */
function placeStairsUp(gG, gRooms, uG, uRooms, rng, doors) {
  const gCand = gRooms.filter((r) => r.iw >= 3 && r.ih >= 3);
  const uCand = uRooms.filter((r) => r.iw >= 3 && r.ih >= 3);
  for (let attempt = 0; attempt < 40; attempt++) {
    const a = pick(rng, gCand), b = pick(rng, uCand);
    // find a 2-cell vertical strip free on both floors
    for (let t = 0; t < 30; t++) {
      const x = irnd(rng, Math.max(a.x, b.x) + 1, Math.min(a.x + a.iw, b.x + b.iw) - 1);
      const y = irnd(rng, Math.max(a.y, b.y) + 1, Math.min(a.y + a.ih, b.y + b.ih) - 2);
      const inA = x >= a.x + 1 && x <= a.x + a.iw && y >= a.y + 1 && y + 1 <= a.y + a.ih;
      const inB = x >= b.x + 1 && x <= b.x + b.iw && y >= b.y + 1 && y + 1 <= b.y + b.ih;
      if (!inA || !inB) continue;
      if (gG[y][x] !== '.' || gG[y + 1][x] !== '.' || uG[y][x] !== '.' || uG[y + 1][x] !== '.') continue;
      let clash = false;
      for (const d of doors || []) for (const c of d.cells)
        if ((c[0] === x || c[0] === x + 1 || c[0] === x - 1) && (c[1] === y || c[1] === y + 1 || c[1] === y - 1)) clash = true;
      if (clash) continue;
      gG[y][x] = 'U'; gG[y + 1][x] = 'U';
      uG[y][x] = 'N'; uG[y + 1][x] = 'N';
      return { a: { x: x + 0.5, y: y + 0.5, z: 0 }, b: { x: x + 0.5, y: y + 0.5, z: 1 } };
    }
  }
  return null;
}

/* A cellar is reached through a locked 2x2 nook cut into a ground-floor
   room corner, so the "two keys" gate can never be bypassed. */
function placeCellar(gG, gRooms, bG, rng, doors) {
  /* A 2x1 nook cut into a room corner: [B][N] plus two seal walls and one
     open side. Four orientations, validated against the basement bounds. */
  const insideBase = (x, y) => x > BASE.x && x < BASE.x + BASE.w - 1 && y > BASE.y && y < BASE.y + BASE.h - 1;
  const cands = gRooms.slice().sort(
    (a, b) => Math.hypot(a.cx - (BASE.x + BASE.w / 2), a.cy - (BASE.y + BASE.h / 2)) -
              Math.hypot(b.cx - (BASE.x + BASE.w / 2), b.cy - (BASE.y + BASE.h / 2))
  );
  for (const r of cands) {
    if (r.iw < 4 || r.ih < 3) continue;
    const corners = [
      // door, stair neighbour, seal row on the inner side, outer wall cells
      { d: [r.x + r.iw - 1, r.y + 1], n: [r.x + r.iw, r.y + 1], s: [[r.x + r.iw - 1, r.y + 2], [r.x + r.iw, r.y + 2]], o: [[r.x + r.iw - 1, r.y], [r.x + r.iw, r.y]] },
      { d: [r.x + 2, r.y + 1], n: [r.x + 1, r.y + 1], s: [[r.x + 1, r.y + 2], [r.x + 2, r.y + 2]], o: [[r.x + 1, r.y], [r.x + 2, r.y]] },
      { d: [r.x + r.iw - 1, r.y + r.ih], n: [r.x + r.iw, r.y + r.ih], s: [[r.x + r.iw - 1, r.y + r.ih - 1], [r.x + r.iw, r.y + r.ih - 1]], o: [[r.x + r.iw - 1, r.y + r.ih + 1], [r.x + r.iw, r.y + r.ih + 1]] },
      { d: [r.x + 2, r.y + r.ih], n: [r.x + 1, r.y + r.ih], s: [[r.x + 1, r.y + r.ih - 1], [r.x + 2, r.y + r.ih - 1]], o: [[r.x + 1, r.y + r.ih + 1], [r.x + 2, r.y + r.ih + 1]] },
    ];
    for (const c of corners) {
      const [dx, dy] = c.d, [nx, ny] = c.n;
      if (!insideBase(nx, ny) || !insideBase(dx, dy)) continue;
      if (gG[dy][dx] !== '.' || gG[ny][nx] !== '.') continue;
      let ok = true;
      for (const [sx, sy] of c.s) if (gG[sy][sx] === '#' || gG[sy][sx] === 'F') ok = false; // already wall = fine
      // the far side must be genuine wall, never a door or window
      for (const [ox, oy] of c.o) if ((gG[oy] || [])[ox] !== '#') ok = false;
      if (!ok) continue;
      // the door must face open floor
      const side = dx < nx ? [dx - 1, dy] : [dx + 1, dy];
      if (gG[side[1]][side[0]] !== '.') continue;
      // the far side of the stair must be real wall, or the nook leaks
      const far = dx < nx ? [nx + 1, ny] : [nx - 1, ny];
      const farC = (gG[far[1]] || [])[far[0]];
      if (farC !== '#' ) continue;
      let doorClash = false;
      for (const q of doors || []) for (const c of q.cells) if (Math.abs(c[0] - dx) + Math.abs(c[1] - dy) < 2) doorClash = true;
      if (doorClash) continue;
      // apply
      gG[dy][dx] = 'B'; gG[ny][nx] = 'N';
      for (const [sx, sy] of c.s) gG[sy][sx] = '#';
      bG[ny][nx] = 'U'; bG[ny][dx] = '.';
      if (doors) doors.push({ cells: [[dx, dy]], axis: dx < nx ? 'v' : 'v', closed: 1, kind: 'cellar', z: 0 });
      return { door: { x: dx, y: dy, z: 0 }, stair: { x: nx + 0.5, y: ny + 0.5, z: 0 }, b: { x: nx + 0.5, y: ny + 0.5, z: 2 }, side };
    }
  }
  return null;
}

/* ------------------------------------------------------------ validate */
function crawl(G, from, blocked) {
  const seen = new Set();
  const q = [from];
  seen.add(from[0] + ',' + from[1]);
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (seen.has(k) || G[ny] === undefined) continue;
      const c = G[ny][nx];
      if (SOLID[c] || c === 'F') continue;
      if (c === 'D' && blocked) continue;
      seen.add(k); q.push([nx, ny]);
    }
  }
  return seen;
}

function worldWalkable(G, x, y) {
  if (x < 0 || y < 0 || x >= MW || y >= MH) return false;
  const c = G[y][x];
  if (SOLID[c] || c === 'F') return false;
  return true;
}

/* dev/test surface (also handy in the console) */
const WGEN = {
  MW, MH, HOUSE, BASE, SOLID, OPAQUE, THEMES,
  mulberry, pick, irnd, mkGrid, fillRect, borderRect, eachRect,
  bsp, leavesOf, connectTree, addWindows, furnish, roomConnected,
  mkFloor, makeRooms, assignTypes, buildYard, placeStairsUp, placeCellar,
  crawl, worldWalkable, insideRoom,
};

/* ===== gen.js ===== */
'use strict';
/* =====================================================================
   gen.js — assembles a complete, validated house from the primitives in
   world.js. A seed is only accepted when the result is provably solvable.
   ===================================================================== */

function hashSeed(seed, attempt) {
  let h = (seed ^ 0x9e3779b9) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 2246822507) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 3266489909) >>> 0;
  return (h ^ Math.imul(attempt + 1, 0x27d4eb2d)) >>> 0;
}

/* ------------------------------------------------------- 3D reachability */
function reach3D(w, start, opt) {
  opt = opt || {};
  const openDoors = opt.openDoors !== false;
  const study = !!opt.study;
  const cellar = !!opt.cellar;
  const key = (z, x, y) => z + ':' + x + ':' + y;
  const sx = start.x | 0, sy = start.y | 0;
  const seen = new Set([key(start.z, sx, sy)]);
  const q = [[sx, sy, start.z]];
  const stairMap = w.stairMap;
  while (q.length) {
    const [x, y, z] = q.pop();
    const F = w.floors[z];
    if (!F) continue;
    const push = (nx, ny, nz) => {
      const k = key(nz, nx, ny);
      if (seen.has(k)) return;
      const G = w.floors[nz].G;
      if (G[ny] === undefined || G[ny][nx] === undefined) return;
      const c = G[ny][nx];
      if (SOLID[c] || c === 'F') return;
      if (c === 'L' && !study) return;
      if (c === 'B' && !cellar) return;
      if (c === 'D' && !openDoors) return;
      seen.add(k); q.push([nx, ny, nz]);
    };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) push(x + dx, y + dy, z);
    const link = stairMap[key(z, x, y)];
    if (link) push(link.x, link.y, link.z);
  }
  return seen;
}

/* Every room must be enterable from its own doorway network. */
function allRoomsReachable(w, seen) {
  const bad = [];
  for (const r of w.rooms) {
    let ok = false;
    for (let y = r.y + 1; y <= r.y + r.ih && !ok; y++)
      for (let x = r.x + 1; x <= r.x + r.iw; x++)
        if (seen.has(r.z + ':' + x + ':' + y)) { ok = true; break; }
    if (!ok) bad.push(r.z + ':' + r.id);
  }
  return bad;
}

function adjacentFree(w, x, y, z) {
  const G = w.floors[z].G;
  const out = [];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = x + dx, ny = y + dy;
    if (G[ny] === undefined) continue;
    const c = G[ny][nx];
    if (!SOLID[c] && c !== 'F') out.push([nx, ny]);
  }
  return out;
}

/* --------------------------------------------------------- containers */
function placeContainer(F, rooms, doors, spec, rng, z) {
  const r = rooms.find((q) => q.type === spec.room);
  if (!r) return null;
  const nearDoor = new Set();
  for (const d of doors) for (const c of d.cells) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) nearDoor.add((c[0] + dx) + ',' + (c[1] + dy));
  const tries = [];
  for (let y = r.y + 1; y <= r.y + r.ih; y++) for (let x = r.x + 1; x <= r.x + r.iw - spec.w + 1; x++) {
    let ok = F.G[y][x] === '.' && !nearDoor.has(x + ',' + y);
    for (let i = 1; i < spec.w && ok; i++) if (F.G[y][x + i] !== '.') ok = false;
    if (ok) tries.push([x, y]);
  }
  // prefer hugging a wall
  tries.sort((a, b) => wallScore(F, b[0], b[1]) - wallScore(F, a[0], a[1]));
  for (const [x, y] of tries) {
    const saved = [];
    for (let i = 0; i < spec.w; i++) { saved.push([x + i, y, F.G[y][x + i]]); F.G[y][x + i] = 'S'; }
    const freeAfter = adjacentFree({ floors: [F] }, x, y, 0);
    for (let i = 1; i < spec.w; i++) for (const a of adjacentFree({ floors: [F] }, x + i, y, 0)) if (!freeAfter.some((q) => q[0] === a[0] && q[1] === a[1])) freeAfter.push(a);
    if (roomConnected(F.G, r) && freeAfter.length) {
      const stand = freeAfter[0];
      F.furniture.push({ k: spec.k, x, y, w: spec.w, h: 1, z, room: r.id, box: 1 });
      return { id: spec.id, x: x + spec.w / 2, y: y + 0.5, tx: x, ty: y, w: spec.w, z, label: spec.label, gives: spec.gives, stand };
    }
    for (const s of saved) F.G[s[1]][s[0]] = s[2];
  }
  return null;
}
function wallScore(F, x, y) {
  let s = 0;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const c = (F.G[y + dy] || [])[x + dx];
    if (c === '#' || c === 'W' || c === 'S') s++;
  }
  return s;
}

/* ------------------------------------------------------------- items */
function scatterItems(F, rooms, rng, n, z) {
  const out = [];
  const spots = [];
  for (const r of rooms) {
    if (r.type === 'vault') continue;
    for (let y = r.y + 1; y <= r.y + r.ih; y++) for (let x = r.x + 1; x <= r.x + r.iw; x++) if (F.G[y][x] === '.') spots.push([x, y, r]);
  }
  for (let i = 0; i < n * 20 && out.length < n; i++) {
    const [x, y] = spots[(rng() * spots.length) | 0] || [0, 0];
    if (F.G[y] === undefined || F.G[y][x] !== '.') continue;
    out.push({ k: pick(rng, ['vase', 'vase', 'can', 'can', 'lamp', 'chair', 'box']), x: x + 0.5, y: y + 0.5, z, home: { x: x + 0.5, y: y + 0.5, z } });
  }
  return out;
}

/* ------------------------------------------------------------ assemble */
let LAST_STAGE='init';
function tryBuild(seed, labelSeed) {
  const rng = mulberry(seed);
  const gF = mkFloor(0, 'Ground floor', ',');
  const uF = mkFloor(1, 'Upstairs', 'F');
  const bF = mkFloor(2, 'Basement', 'F');

  // yard
  fillRect(gF.G, 0, 0, MW, MH, ',');
  for (let x = 1; x < MW - 1; x++) { gF.G[1][x] = 'F'; gF.G[MH - 2][x] = 'F'; }
  for (let y = 1; y < MH - 1; y++) { gF.G[y][1] = 'F'; gF.G[y][MW - 2] = 'F'; }

  // house shell
  for (const F of [gF, uF]) fillRect(F.G, HOUSE.x, HOUSE.y, HOUSE.w, HOUSE.h, '#');
  // basement shell
  borderRect(bF.G, BASE.x, BASE.y, BASE.w, BASE.h, '#');
  fillRect(bF.G, BASE.x + 1, BASE.y + 1, BASE.w - 2, BASE.h - 2, '.');

  const doors = [];
  const buildFloor = (F, depth) => {
    const root = bsp(HOUSE.x, HOUSE.y, HOUSE.w, HOUSE.h, depth, rng);
    const leaves = leavesOf(root);
    for (const l of leaves) fillRect(F.G, l.x + 1, l.y + 1, l.w - 2, l.h - 2, '.');
    F.rooms = makeRooms(leaves, F.G, F.z, rng);
    const fdoors = [];
    connectLeaves(F.G, leaves, fdoors, rng, 0.22);
    for (const d of fdoors) d.z = F.z;
    F.doors = fdoors;
    for (const d of fdoors) doors.push(d);
    return root;
  };
  const gRoot = buildFloor(gF, 4);
  const uRoot = buildFloor(uF, 3);

  LAST_STAGE='rooms'; if (gF.rooms.length < 4 || uF.rooms.length < 3) return null;

  // ---- stairs up
  LAST_STAGE='stairs'; const up = placeStairsUp(gF.G, gF.rooms, uF.G, uF.rooms, rng, gF.doors.concat(uF.doors));
  if (!up) return null;

  // functional rooms — kitchen downstairs, study upstairs, both mandatory.
  // The study must be a dead end so locking its only door really gates the
  // blue key without cutting off the rest of the house.
  const uDegree = new Map(uF.rooms.map((r) => [r.id, roomDegree(r, uF.doors)]));
  const hasStair = (r) => {
    for (let y = r.y + 1; y <= r.y + r.ih; y++) for (let x = r.x + 1; x <= r.x + r.iw; x++) {
      const c = uF.G[y][x];
      if (c === 'U' || c === 'N') return true;
    }
    return false;
  };
  const deadEnds = uF.rooms.filter((r) => uDegree.get(r.id) === 1 && !hasStair(r) && r.iw >= 4 && r.ih >= 4)
    .sort((a, b) => b.iw * b.ih - a.iw * a.ih);
  if (!deadEnds.length) { LAST_STAGE = 'types'; return null; }
  const study = deadEnds[0];
  study.type = 'study';
  const gTypes = assignTypes(gF.rooms, rng, ['kitchen', 'living', 'bedroom', 'bathroom', 'workshop', 'hall']);
  assignTypes(uF.rooms.filter((r) => r.id !== study.id), rng, ['bedroom', 'bathroom', 'living', 'hall']);
  const kitchen = gTypes.kitchen;
  LAST_STAGE = 'types';
  if (!kitchen) return null;
  const studyFloor = uF;

  // lock the study's single door
  let locked = 0;
  for (const d of studyFloor.doors) {
    let inside = false;
    for (const c of d.cells) for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = c[0] + dx, ny = c[1] + dy;
      if (nx >= study.x + 1 && nx <= study.x + study.iw && ny >= study.y + 1 && ny <= study.y + study.ih) inside = true;
    }
    if (inside) {
      for (const c of d.cells) studyFloor.G[c[1]][c[0]] = 'L';
      d.kind = 'lock'; d.closed = 1; locked++;
    }
  }
  LAST_STAGE = 'study-lock';
  if (locked !== 1) return null;

  // ---- cellar
  LAST_STAGE='cellar'; const cellar = placeCellar(gF.G, gF.rooms, bF.G, rng, gF.doors);
  if (!cellar) return null;
  // clear basement furniture space around the stair and the vault prize
  const bx = cellar.b.x | 0, by = cellar.b.y | 0;
  bF.G[by][bx] = 'U';
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (bF.G[by + dy] && bF.G[by + dy][bx + dx] !== '#') bF.G[by + dy][bx + dx] = '.';
  let secret = null;
  for (let t = 0; t < 60 && !secret; t++) {
    const sx = irnd(rng, BASE.x + 2, BASE.x + BASE.w - 3), sy = irnd(rng, BASE.y + 2, BASE.y + BASE.h - 3);
    if (bF.G[sy][sx] === '.' && Math.hypot(sx - bx, sy - by) > 4) secret = { x: sx + 0.5, y: sy + 0.5, z: 2 };
  }
  LAST_STAGE='secret'; if (!secret) return null;
  bF.G[secret.y | 0][secret.x | 0] = 'V';

  // ---- basement dressing
  const vRooms = [{ id: '2:0', z: 2, x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h, iw: BASE.w - 2, ih: BASE.h - 2, cx: BASE.x + BASE.w / 2, cy: BASE.y + BASE.h / 2, type: 'vault', name: 'Vault' }];
  bF.rooms = vRooms;
  bF.furniture = furnish(bF.G, vRooms, [], rng, 2);

  // ---- furniture + windows + doors
  const gFurn = furnish(gF.G, gF.rooms, gF.doors, rng, 0);
  const uFurn = furnish(uF.G, uF.rooms, uF.doors, rng, 1);
  gF.furniture = gFurn;
  uF.furniture = uFurn;

  // ---- front door + porch
  let front = null;
  for (let t = 0; t < 80 && !front; t++) {
    const fx = irnd(rng, HOUSE.x + 3, HOUSE.x + HOUSE.w - 4);
    const fy = HOUSE.y + HOUSE.h - 1;
    if (gF.G[fy][fx] !== 'W' && gF.G[fy][fx] !== '#' ) continue;
    if (gF.G[fy - 1][fx] !== '.') continue;
    let nearDoor = false;
    for (const d of gF.doors) for (const c of d.cells) if (Math.abs(c[0] - fx) + Math.abs(c[1] - fy) < 2) nearDoor = true;
    if (nearDoor) continue;
    if (gF.G[fy][fx] === 'W') {
      const wi = gWins.findIndex((q) => q.x === fx && q.y === fy);
      if (wi >= 0) gWins.splice(wi, 1);
    }
    gF.G[fy][fx] = 'D';
    const fd = { cells: [[fx, fy]], axis: 'h', z: 0, closed: 1, kind: 'door', front: 1 };
    gF.doors.push(fd); doors.push(fd);
    // porch
    for (let y = fy + 1; y < MH - 2; y++) if (gF.G[y][fx] === ',') gF.G[y][fx] = 'P';
    front = { x: fx + 0.5, y: fy + 0.5, z: 0, ix: fx, iy: fy };
    break;
  }
  LAST_STAGE='front'; if (!front) return null;

  // ---- shed
  LAST_STAGE='shed'; const shed = buildYard(gF.G, rng, doors);
  if (!shed) return null;

  // ---- containers
  const containers = [];
  const fridge = placeContainer(gF, gF.rooms, gF.doors, { room: 'kitchen', id: 'fridge', k: 'fridge', w: 1, label: 'fridge', gives: 'red' }, rng, 0);
  const desk = placeContainer(studyFloor, studyFloor.rooms, studyFloor.doors, { room: study.type, id: 'desk', k: 'desk', w: 2, label: 'desk', gives: 'blue' }, rng, study.z);
  LAST_STAGE='containers'; if (!fridge || !desk) return null;
  containers.push(fridge, desk);
  // toolbox in the shed
  let toolbox = null;
  for (const [x, y] of shed.interior) {
    if (gF.G[y][x] !== '.') continue;
    if (adjacentFree({ floors: [gF] }, x, y, 0).length < 2) continue;
    gF.G[y][x] = 'S';
    toolbox = { id: 'toolbox', x: x + 0.5, y: y + 0.5, tx: x, ty: y, z: 0, label: 'toolbox', gives: 'pick', stand: adjacentFree({ floors: [gF] }, x, y, 0)[0] };
    gF.furniture.push({ k: 'toolbox', x, y, w: 1, h: 1, z: 0, box: 1 });
    break;
  }
  LAST_STAGE='toolbox'; if (!toolbox) return null;
  containers.push(toolbox);

  // ---- loose items
  const items = scatterItems(gF, gF.rooms, rng, 8, 0).concat(scatterItems(uF, uF.rooms, rng, 5, 1));

  // ---- windows last, so nothing can end up behind one
  LAST_STAGE = 'windows';
  const gWins = addWindows(gF.G, 0, HOUSE, gF.doors, rng);
  const uWins = addWindows(uF.G, 1, HOUSE, uF.doors, rng);
  if (gWins.length < 3) return null;

  // ---- spawn: just inside the gate
  let spawn = null;
  for (let y = MH - 3; y > MH - 8 && !spawn; y--) {
    for (let x = 2; x < MW - 2; x++) {
      if (gF.G[y][x] === ',' && gF.G[y - 1][x] === ',') { spawn = { x: x + 0.5, y: y + 0.5, z: 0 }; break; }
    }
  }
  LAST_STAGE='spawn'; if (!spawn) return null;

  const stairMap = {};
  const stairs = [];
  const addStair = (a, b) => {
    stairs.push({ a, b });
    stairMap[a.z + ':' + (a.x | 0) + ':' + (a.y | 0)] = { x: b.x | 0, y: b.y | 0, z: b.z };
    stairMap[b.z + ':' + (b.x | 0) + ':' + (b.y | 0)] = { x: a.x | 0, y: a.y | 0, z: a.z };
  };
  addStair({ x: up.a.x, y: up.a.y, z: 0 }, { x: up.b.x, y: up.b.y, z: 1 });
  addStair({ x: cellar.stair.x, y: cellar.stair.y, z: 0 }, { x: cellar.b.x, y: cellar.b.y, z: 2 });

  // rooms/stairs/cellar/front/shed may have appended doors after the copy above;
  // the master list must reference those same objects so kind/closed stay in sync
  for (const d of gF.doors) if (!doors.includes(d)) doors.push(d);
  for (const d of uF.doors) if (!doors.includes(d)) doors.push(d);

  const w = {
    seed, genSeed: seed, attempts: 0,
    floors: [gF, uF, bF],
    rooms: gF.rooms.concat(uF.rooms, vRooms).map((r) => Object.assign(r, { name: roomName(r) })),
    doors, containers, items, windows: gWins.concat(uWins),
    stairs, stairMap, shed, spawn, secret, front,
    study, kitchen, cellar, up,
    meta: {
      rooms: gF.rooms.length + uF.rooms.length + 1,
      doors: doors.length,
      windows: gWins.length + uWins.length,
      seed,
    },
  };
  w.floors[0].items = items.filter((i) => i.z === 0);
  w.floors[1].items = items.filter((i) => i.z === 1);
  return w;

}

function roomName(r) {
  const map = { kitchen: 'kitchen', study: 'study', bedroom: 'bedroom', bathroom: 'bathroom', living: 'living room', workshop: 'workshop', hall: 'hallway', vault: 'vault' };
  const base = map[r.type] || 'room';
  return base;
}

/* --------------------------------------------------------- validation */
function validateWorld(w) {
  const issues = [];
  if (!w || !w.floors || w.floors.length !== 3) return ['missing floors'];

  // 1. every room reachable with everything open
  const all = reach3D(w, w.spawn, { study: true, cellar: true, openDoors: true });
  for (const bad of allRoomsReachable(w, all)) issues.push('unreachable room ' + bad);

  // 2. staged progression
  const base = reach3D(w, w.spawn, { study: false, cellar: false, openDoors: true });

/* ------------------------------------------------------------- perception */
function sightRange() {
  const h = GAME.clock;
  let r = 10.5 + Math.min(3, M.catches * 0.6);
  if (isNight(h)) r *= 0.8;                       // 20% shorter at night
  if (P.crouch) r *= 0.55;
  if (P.sprint) r *= 1.15;                        // sprinting gives you away
  if (P.flash) r *= 1.5;
  if (roomLit(P.z, P.x, P.y)) r *= 1.1;
  if (isNight(h) && !litAt(P.z, P.x, P.y)) r *= 0.85;

  return r;
}
function fovDot() { return 0.55; }

function lineOfSight(a, b) {
  if (a.z !== b.z) return false;
  const d = dst(a.x, a.y, b.x, b.y);
  const n = Math.ceil(d / 0.28);
  for (let i = 1; i < n; i++) {
    const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
    const c = T(a.z, x | 0, y | 0);
    if (c === '#' || c === 'F' || c === 'S' || c === 'W' || c === 'X') return false;
    if (c === 'D' && doorClosed(a.z, x | 0, y | 0)) return false;
  }
  return true;
}

function perceive(dt) {
  if (!P) return;
  if (!N.pp) N.pp = { x: P.x, y: P.y };
  const d = P.z === N.z ? dst(N.x, N.y, P.x, P.y) : 99;
  N.dist = d;
  const los = lineOfSight(N, P);
  const ang = Math.atan2(P.y - N.y, P.x - N.x);
  const off = Math.abs(Math.atan2(Math.sin(ang - N.a), Math.cos(ang - N.a)));
  const range = sightRange();
  const inCone = off < 0.95 * 1.15;
  N.sees = (d < range && (inCone || d < 2.2) && los) ? 1 : 0;
  N.periph = (!N.sees && d < 5.5 && off < 1.65 && los) ? 1 : 0;
  N.losT = los ? N.losT + dt : 0;

  if (N.sees) {
    const close = d < 4;
    N.locked = 1;
    N.al = Math.min(1, N.al + dt * (close ? 3.4 : 1.7) * (N.sleeping ? 0.35 : 1));
    N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t };
    if (dt > 0) {
      const k = Math.min(1, dt * 6);
      N.pvel.x = lerp(N.pvel.x, clamp((P.x - N.pp.x) / dt, -7, 7), k);
      N.pvel.y = lerp(N.pvel.y, clamp((P.y - N.pp.y) / dt, -7, 7), k);
    }
    M.hours[GAME.clock | 0] = (M.hours[GAME.clock | 0] || 0) + dt * 0.8;
    M.rooms[roomNameAt(P.z, P.x, P.y)] = (M.rooms[roomNameAt(P.z, P.x, P.y)] || 0) + dt;
    M.suspicion = Math.min(100, M.suspicion + dt * (isNight(GAME.clock) ? 1.6 : 2.4));
    // he watches: sight is sticky, so a player standing in the open is caught
    if (N.al > 0.12 && N.prio < 3) turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 7);
  } else {
    N.locked = 0;
    N.al = Math.max(0, N.al - dt * 0.32);
    N.pvel.x *= 0.97; N.pvel.y *= 0.97;
  }
  N.pp = { x: P.x, y: P.y };

  if (N.sleeping && N.sees) {
    // lighter sleeper after a catch
    N.sleeping = 0;
    aiSay('Huh? …I heard that.');
  }
  if (N.mode !== 'chase') {
    if (N.sees && N.al >= 1) {

/* ------------------------------------------------------------------ hearing */
function hearNoise(x, y, z, radius, tag) {
  if (!N || GAME.state !== 'play' || N.mode === 'chase') return;
  const floorGap = Math.abs(N.z - z);
  const d = floorGap ? 99 : dst(N.x, N.y, x, y);
  if (floorGap > 0) {
    if (radius < 10) return;               // through a floor: only loud things
  }
  const walls = wallCount(N.z, N.x, N.y, x, y);
  const eff = (radius * Math.pow(0.74, walls) * (floorGap ? 0.4 : 1)) * (N.sleeping ? 0.55 : 1);
  if (d > eff) return;

  // suspicion feeds on every sound he can place
  M.suspicion = Math.min(100, M.suspicion + (tag === 'glass' ? 3.2 : tag === 'trap' ? 5 : 1.1));
  M.hours[GAME.clock | 0] = (M.hours[GAME.clock | 0] || 0) + 0.2;

  if (tag !== 'step') {
    N.sounds.push({ x, y, z, t: GAME.t, tag, r: radius });
    if (N.sounds.length > 12) N.sounds.shift();
  } else {
    N.sounds.push({ x, y, z, t: GAME.t, tag, r: radius });
    if (N.sounds.length > 12) N.sounds.shift();
  }

  // ---- belief: sounds always sharpen the map, even mid-search
  belAdd(z, x, y, tag === 'glass' ? 2.4 : 1.1);
  if (N.mode === 'search') {
    N.searchT = Math.min(N.searchT, 8);
    N.lastHeard = { x, y, z, t: GAME.t };
    if (N.prio < 2) {
      const spot = belPeak(z);
      if (spot && N.searchN > 0) { /* he re-aims on the next search step */ N.reaim = { x: spot.x, y: spot.y, z }; }
    }
    return; // never yanks the search script around mid-stride
  }

  if (N.stun > 0) return;

  // ---- rolling footstep tracking: 3+ sounds in 6 s predicts a position
  const recent = N.sounds.filter((s) => GAME.t - s.t < 6 && s.z === z);
  if (recent.length >= 3 && tag === 'step') {
    const first = recent[0], last = recent[recent.length - 1];
    const dt = Math.max(0.2, last.t - first.t);
    const vx = clamp((last.x - first.x) / dt, -6, 6);
    const vy = clamp((last.y - first.y) / dt, -6, 6);
    const lead = clamp(dt * 0.8, 0.5, 2.2);
    const px = last.x + vx * lead, py = last.y + vy * lead;
    N.track = { x: px, y: py, z, vx, vy, t: GAME.t };
    if (N.mode === 'routine' || N.mode === 'suspicious' || N.mode === 'ambush') {
      N.mode = 'suspicious';
      runScript('follow_sound', { x: px, y: py, z }, 2);
      aiSay('Following the sound…');
    }
    return;
  }

  if (N.sleeping) {
    // one catch teaches him to sleep with one eye open
    const wakeAt = Math.max(2.5, 9 - M.catches * 2 - M.suspicion * 0.03);
    if (radius > wakeAt || N.sees) { N.sleeping = 0; runScript('wake_up', {}, 2); }
    return;
  }
  if (N.prio >= 2) return;      // already busy with something more urgent
  if (tag === 'glass') { runScript('check_window', { x: x | 0, y: y | 0, z }, 2); return; }
  if (tag === 'door') { runScript('check_door', { x: x | 0, y: y | 0, z }, 2); return; }
  if (tag === 'trap') { runScript('check_traps', {}, 2); return; }
  if (tag === 'camera') { runScript('check_camera', { x: x | 0, y: y | 0, z }, 2); return; }
  N.mode = 'suspicious';
  runScript('inspect_noise', { x, y, z }, 2);
}

function wallCount(az, ax, ay, bx, by) {
  if (az !== bx && false) return 0;
  const d = dst(ax, ay, bx, by);
  const n = Math.ceil(d / 0.4);
  let w = 0, prev = false;
  for (let i = 1; i < n; i++) {
    const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n;
    const c = T(az, x | 0, y | 0);
    const blocked = c === '#' || c === 'S' || c === 'W' || c === 'X' || (c === 'D' && doorClosed(az, x | 0, y | 0));
    if (blocked && !prev) w++;
    prev = blocked;
  }
  return w;
}

      for (const [dx, dy] of NB4) if (walkCell(z, x + dx, y + dy)) nb.push(i + dy * MW + dx);
      out[i] += v * 0.55;
      for (const j of nb) out[j] += v * 0.45 / nb.length;
    }
    for (let i = 0; i < B.length; i++) B[i] = B[i] * 0.6 + out[i] * 0.9;
  }
  belNormalize();
}
function belPeak(z) {
  const B = BEL[z];
  let bi = -1, bv = 0;
  for (let y = 2; y < MH - 2; y++) for (let x = 2; x < MW - 2; x++) {
    const i = y * MW + x;
    if (B[i] <= bv) continue;
    if (!walkCell(z, x, y)) continue;
    bv = B[i]; bi = i;
  }
  if (bi < 0) return null;
  return { x: bi % MW + 0.5, y: (bi / MW | 0) + 0.5, z, v: bv };
}
function belSpots(z, n) {
  const B = BEL[z], arr = [];
  for (let y = 2; y < MH - 2; y++) for (let x = 2; x < MW - 2; x++) {
    let s = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += B[(y + dy) * MW + x + dx];
    if (s <= 0.02 || !walkCell(z, x, y)) continue;
    let pen = 1;
    for (const c of N.cleared) if (c.z === z && dst(x, y, c.x, c.y) < 3) pen = 0.2;
    arr.push({ x: x + 0.5, y: y + 0.5, z, s: s * pen / (1 + dst(N.x, N.y, x, y) * 0.05) });
  }
  arr.sort((a, b) => b.s - a.s);
  const out = [];
  for (const a of arr) {
    if (out.some((o) => dst(o.x, o.y, a.x, a.y) < 3.5)) continue;
    out.push(a);
    if (out.length >= n) break;
  }
  return out;
}

/* --------------------------------------------------------------- movement */
function turnTo(target, dt, rate) {
  const d = Math.atan2(Math.sin(target - N.a), Math.cos(target - N.a));
  N.a += clamp(d, -rate * dt, rate * dt);
}

function followPath(dt, speed) {
  if (!N.path.length) return 1;
  const wp = N.path[0];
  const tx = wp.x + 0.5, ty = wp.y + 0.5;
  if (wp.z !== N.z) {
    // a stair hand-off: he must be standing on the stair tile
    if (dst(N.x, N.y, tx, ty) < 1.1) {
      N.x = tx; N.y = ty; N.z = wp.z;
      N.path.shift();
    } else {
      N.path = pathFind({ x: N.x, y: N.y, z: N.z }, wp, { allowClosed: 1 });
      if (!N.path.length) return 1;
    }
    return 0;
  }
  const dx = tx - N.x, dy = ty - N.y, d = Math.hypot(dx, dy);
  if (d < 0.26) { N.path.shift(); return N.path.length ? 0 : 1; }
  turnTo(Math.atan2(dy, dx), dt, 9);
  // doors: open instead of bumping
  const ax = N.x + Math.cos(N.a) * 0.55, ay = N.y + Math.sin(N.a) * 0.55;
  const ahead = T(N.z, ax | 0, ay | 0);
  if (ahead === 'D' && doorClosed(N.z, ax | 0, ay | 0)) {
    openDoor(N.z, ax | 0, ay | 0, null);
    N.openT = 0.35;
    return 0;
  }
  if (N.openT > 0) { N.openT -= dt; return 0; }

  const step = Math.min(speed * dt, d);
  const ox = N.x, oy = N.y;
  moveCircle(N, (dx / d) * step, (dy / d) * step, 0.29);
  if (dst(ox, oy, N.x, N.y) < step * 0.25) {
    N.stuck += dt;
    if (N.stuck > 0.28) {
      N.stuck = 0; N.jink = (N.jink || 0) + 1; N.repath = 1;
      const sgn = N.jink % 2 ? 1 : -1;
      moveCircle(N, (-dy / d) * step * 2 * sgn, (dx / d) * step * 2 * sgn, 0.29);
      if (N.jink > 4) { N.jink = 0; N.path = []; }
    }
  } else N.stuck = 0;
  return 0;
}

function goTo(x, y, z, opt) {
  const p = pathFind({ x: N.x, y: N.y, z: N.z }, { x, y, z }, Object.assign({ allowClosed: 1 }, opt || {}));
  N.path = p;
  return p.length > 0;
}

function runScript(name, params, prio) {
  const build = SCRIPTS[name];
  if (!build) return;
  N.st = name;
  N.script = build(params || {});
  N.si = 0; N.stepT = 0; N.path = []; N.prio = prio || 0;
  N.label = (N.script[0] && N.script[0].label) || '';
}
function endScript() {
  N.script = []; N.si = 0; N.prio = 0;
  if (N.mode === 'search') { searchNext(); return; }
  N.mode = 'routine';
  pickTask();
}

function scriptUpdate(dt) {
  if (!N.script.length) { endScript(); return; }
  const sc = N.script, idx = N.si;
  const s = sc[idx];
  if (!s) { endScript(); return; }
  // A step may install a whole new script (endScript/pickTask/runScript). Only
  // advance the cursor if we are still looking at the same step afterwards.
  const advance = () => {
    if (N.script === sc && N.si === idx) N.si = idx + 1;
    N.stepT = 0; N.goT = 0;
  };
  if (s.go) {
    if (N.repath || !N.path.length) {
      N.repath = 0;
      if (!goTo(s.go[0], s.go[1], s.go[2])) { advance(); return; }
    }
    N.label = s.label || N.label;
    if (followPath(dt, N.speed || 2.4)) { advance(); return; }
    N.goT = (N.goT || 0) + dt;
    if (N.goT > 22) { N.path = []; advance(); }
  } else if (s.wait != null) {
    N.stepT += dt;
    N.label = s.label || '';
    if (s.face) turnTo(Math.atan2(s.face[1] - N.y, s.face[0] - N.x), dt, 5);
    else if (s.faceP) turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 5);
    else if (s.sweep && !N.locked) N.a += Math.sin(GAME.t * 2.6) * dt * 1.8;
    if (s.eff) for (const k in s.eff) N.need[k] = clamp((N.need[k] || 0) + s.eff[k] / s.wait, 0, 1);
    if (N.stepT >= s.wait) advance();
  } else if (s.fn) { s.fn(); advance(); }
}

/* ------------------------------------------------------------- search mode */
function startSearch(reason) {
  if (N.mode === 'chase' && reason !== 'lost') return;
  N.mode = 'search';
  N.mode = 'search'; N.searchT = 0; N.searchN = 0; N.cleared = []; N.prio = 0;
  N.searchReason = reason || 'lost';
  belSeed();
  aiSay('I know you are still in here.');
  searchNext();
}
function endSearchStep() {
  N.searchN++;
  if (N.mode === 'search') searchNext();
}
function searchNext() {
  if (N.mode !== 'search') return;
  if (N.searchT > 34) { N.mode = 'routine'; runScript('calm_down', {}, 1); return; }
  const total = belTotal(N.z) + belTotal(0) * 0.3 + belTotal(1) * 0.3;
  if (total < 0.05) { N.mode = 'routine'; runScript('calm_down', {}, 1); return; }

  // every third step: chokepoint ambush instead of sweeping
  if (N.searchN > 0 && N.searchN % 3 === 0) {
    const door = bestAmbushDoor();
    if (door) {
      runScript('ambush_door', { x: door.x, y: door.y, z: door.z, fx: door.fx, fy: door.fy }, 2);
      N.ambush = (N.ambush || 0) + 1;
      return;
    }
  }
  const spots = belSpots(N.z, 6).concat(belSpots(0, 3), belSpots(1, 3)).sort((a, b) => b.s - a.s);
  for (const s of spots) {
    if (goTo(s.x, s.y, s.z)) { runScript('search_spot', { x: s.x, y: s.y, z: s.z }, 2); return; }
  }
  N.mode = 'routine'; runScript('calm_down', {}, 1);
}

function bestAmbushDoor() {
  const peak = belPeak(N.z) || belPeak(0) || belPeak(1);
  if (!peak) return null;
  let best = null, bd = 1e9;
  for (const d of W.doors) {
    if (d.kind === 'lock' || d.kind === 'cellar') continue;
    for (const [x, y] of d.cells) {
      const dist = dst(x, y, peak.x, peak.y);
      if (dist < bd && dist < 26) {
        const q = nearestStandable(d.z, x, y, 0.28);
        if (q) { bd = dist; best = { x: q[0] + 0.5, y: q[1] + 0.5, z: d.z, fx: x + 0.5, fy: y + 0.5 }; }
      }
    }
  }
  return best;
}

/* ------------------------------------------------------------- chase mode */
function startChase(reason) {
  if (N.mode === 'chase') return;
  N.mode = 'chase'; N.chaseT = 0; N.lostT = 0; N.quiet = 0;
  N.script = []; N.prio = 4; N.path = []; N.sleeping = 0;
  M.catches = M.catches; // no change here; catches only on a real catch
  M.suspicion = Math.min(100, M.suspicion + 6);
  aiSay('GOTCHA!');
  say('He spotted you — RUN!');
  addHeatRoute();
}
function startQuietApproach() {
  N.mode = 'suspicious'; N.quiet = 1;
  runScript('follow_sound', { x: P.x, y: P.y, z: P.z }, 2);
  aiSay('I can hear you breathing…');
}
function addHeatRoute() { if (P) M.route[P.z + ':' + (P.x | 0) + ',' + (P.y | 0)] = (M.route[P.z + ':' + (P.x | 0) + ',' + (P.y | 0)] || 0) + 3; }

function updateChase(dt) {
  N.chaseT += dt;
  const d = N.dist;
  const clear = lineOfSight(N, P);
  if (N.sees) {
    N.lostT = 0;
    N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t };
    addHeatRoute();
    if (d < 2.6 && clear) {
      N.speed = 3.55 + Math.min(0.45, M.catches * 0.09);
      turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 12);
      moveCircle(N, Math.cos(N.a) * N.speed * 1.12 * dt, Math.sin(N.a) * N.speed * 1.12 * dt, 0.29);
      N.label = 'LUNGE!';
    } else if (d < 7 && clear) {
      N.speed = 3.6 + Math.min(0.45, M.catches * 0.09);
      turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 10);
      moveCircle(N, Math.cos(N.a) * N.speed * dt, Math.sin(N.a) * N.speed * dt, 0.29);
      N.label = 'get back here!';
      N.path = [];
    } else {
      N.speed = 3.65 + Math.min(0.45, M.catches * 0.09);
      N.label = 'cutting you off!';
      N.repathT -= dt;
      if (N.repathT <= 0 || !N.path.length) {
        N.repathT = 0.35;
        const tgt = cutoffTarget(d);
        if (!goTo(tgt.x, tgt.y, tgt.z)) goTo(P.x, P.y, P.z);
      }
      followPath(dt, N.speed);
    }
    if (N.throwCd === undefined) N.throwCd = 2;
    N.throwCd -= dt;
    if (d > 3.2 && d < 9.5 && clear && N.throwCd <= 0) { nThrow(); N.throwCd = 3.2 - Math.min(1.2, M.catches * 0.2); }
  } else {
    N.lostT += dt;
    N.label = 'where did you go?';
    N.speed = 3.3;
    if (!N.path.length || N.repathT <= 0) {
      N.repathT = 0.5;
      const ls = N.lastSeen || { x: N.x, y: N.y, z: N.z };
      const t = Math.min(N.lostT + 0.5, 3);
      const g = playerGoal() || { x: ls.x, y: ls.y, z: ls.z };
      let p = pathFind(N, { x: ls.x + N.pvel.x * t, y: ls.y + N.pvel.y * t, z: ls.z }, { allowClosed: 1 });
      if (p.length) N.path = p;
      else if (g) goTo(g.x, g.y, g.z);
    }
    followPath(dt, N.speed);
    if (N.lostT > 5.5) { N.mode = 'suspicious'; startSearch('lost'); return; }
  }
  if (N.sees && d > 9) N.label = 'cutting you off!';
  if (d < 0.95 && N.z === P.z) catchPlayer();
}

function cutoffTarget(fallbackDist) {
  const room = roomAt(P.z, P.x, P.y);
  const goal = playerGoal();
  if (room && goal) {
    const exits = [];
    for (const d of W.doors) {
      if (d.kind === 'lock' || d.kind === 'cellar') continue;
      for (const [x, y] of d.cells) {
        const q = nearestStandable(d.z, x, y, 0.28);
        if (!q) continue;
        // does this doorway lie on the way to the player's goal?
        const score = dst(q[0], q[1], goal.x, goal.y) - dst(P.x, P.y, goal.x, goal.y) * 0.8;
        const nd = dst(N.x, N.y, q[0], q[1]);
        const pd = dst(P.x, P.y, q[0], q[1]);
        if (nd < 30) exits.push({ x: q[0] + 0.5, y: q[1] + 0.5, z: d.z, score, nd, pd });
      }
    }
    exits.sort((a, b) => a.score - b.score);
    for (const e of exits) {
      // can he beat the player there?
      const aiT = e.nd / 3.8, pT = e.pd / 3.5;
      if (aiT < pT * 0.92) return e;
    }
  }
  // otherwise: intercept the player's path to their objective
  if (goal) {
    const p = pathFind(P, goal, { allowClosed: 1 });
    if (p.length > 2) {
      const q = p[Math.min(3, p.length - 1)];
      return { x: q.x, y: q.y, z: q.z };
    }
  }
  return { x: P.x, y: P.y, z: P.z };
}

function nThrow() {
  const speed = 9.5;
  const d = Math.max(1, N.dist);
  const t = d / speed;
  const px = P.x + P.vx * t * 0.6, py = P.y + P.vy * t * 0.6;
  const dx = px - N.x, dy = py - N.y, l = Math.hypot(dx, dy) || 1;
  spawnProjectile(Math.random() < 0.5 ? 'tomato' : 'box', N.x + dx / l * 0.5, N.y + dy / l * 0.5, N.z, dx / t, dy / t, 3.6, 'n');
  aiSay('Take that!');
}

function catchPlayer() {
  if (GAME.state !== 'play') return;
  GAME.state = 'over';
  UI.over = 'caught';
  M.catches++;
  M.suspicion = Math.min(100, M.suspicion + 15);
  M.rooms[roomNameAt(P.z, P.x, P.y)] = (M.rooms[roomNameAt(P.z, P.x, P.y)] || 0) + 2;
  M.hours[GAME.clock | 0] = (M.hours[GAME.clock | 0] || 0) + 2;
  M.hides.push({ x: P.x, y: P.y, z: P.z });
  if (M.hides.length > 12) M.hides.shift();
  saveMatch();
  UI.screen = 'over';
}

/* --------------------------------------------------------------- player goal */
function playerGoal() {
  if (!P) return null;
  const byId = {};
  for (const c of W.containers) byId[c.id] = c;
  if (!P.keys.pick && byId.toolbox) return { x: byId.toolbox.x, y: byId.toolbox.y, z: byId.toolbox.z };
  if (!P.keys.red && byId.fridge) return { x: byId.fridge.x, y: byId.fridge.y, z: byId.fridge.z };
  if (!P.keys.blue && byId.desk) return { x: byId.desk.x, y: byId.desk.y, z: byId.desk.z };
  return { x: W.secret.x, y: W.secret.y, z: W.secret.z };
}

/* ----------------------------------------------------------------- thefts */
function visibleSpot(z, x, y) {
  // furniture is solid, so sight-check to the floor tile in front of it
  if (freeCell(z, x | 0, y | 0)) return { x: x | 0, y: y | 0, z };
  for (let rad = 1; rad <= 3; rad++) {
    for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== rad) continue;
      if (freeCell(z, (x | 0) + dx, (y | 0) + dy)) return { x: (x | 0) + dx, y: (y | 0) + dy, z };
    }
  }
  return { x: x | 0, y: y | 0, z };
}
function checkTheftsNear(force) {
  if (!N) return;
  // emptied containers
  for (const c of W.containers) {
    if (!c.done || c.seen) continue;
    const sameFloor = c.z === N.z;
    const spot = visibleSpot(c.z, c.tx + (c.w || 1) / 2, c.ty);
    const near = sameFloor ? dst(N.x, N.y, c.x, c.y) < 12 && lineOfSight(N, spot) : force;
    if (!near) continue;
    c.seen = 1;
    M.thefts.push(c.id);
    M.suspicion = Math.min(100, M.suspicion + 14);
    aiSay('Someone has been in my ' + c.label + '!');
    say('He noticed the ' + c.label + ' had been searched.');
    M.plans.push({ t: 'guard', id: c.id, x: c.x, y: c.y, z: c.z });
    saveMatch();
  }
  // moved or missing loose objects
  for (const it of ITEMS) {
    if (it.noticed || !it.home) continue;
    if (it.x === it.home.x && it.y === it.home.y && it.z === it.home.z) continue;
    const near = it.z === N.z && dst(N.x, N.y, it.home.x, it.home.y) < 9 && lineOfSight(N, visibleSpot(it.z, it.home.x, it.home.y));
    if (!near) continue;
    it.noticed = 1;
    M.suspicion = Math.min(100, M.suspicion + 9);
    M.plans.push({ t: 'tidy', k: it.k });
    aiSay('My ' + it.k + ' is gone!');
    say('He noticed his ' + it.k + ' was missing.');
  }
}

/* ------------------------------------------------------------ re-locking */
function considerRelock() {
  for (const d of W.doors) {
    if (!d.playerUnlocked) continue;
    if (d.z !== N.z) continue;
    for (const [x, y] of d.cells) {
      if (dst(N.x, N.y, x + 0.5, y + 0.5) > 1.6) continue;
      const q = nearestStandable(d.z, x, y, 0.28);
      if (!q) continue;
      runScript('relock', { x: q[0], y: q[1], z: d.z, door: d }, 2);
      return true;
    }
  }
  return false;
}
function applyRelock(p) {
  const d = p.door;
  d.closed = 1;
  d.playerUnlocked = 0;
  for (const [x, y] of d.cells) W.floors[d.z].G[y][x] = d.lockChar || 'L';
  M.suspicion = Math.min(100, M.suspicion + 4);
  M.relocks.push(d.z + ':' + d.cells[0][0] + ':' + d.cells[0][1]);
  saveMatch();
  aiSay('Locked. Try that again.');
  say('He re-locked the door.');
}

/* ------------------------------------------------------------ fortification */
function planBoardWindow(x, y, z) {
  const key = z + ':' + x + ':' + y;
  if (M.plans.some((p) => p.t === 'board' && p.x === x && p.y === y && p.z === z)) return;
  M.plans.push({ t: 'board', x, y, z });
  saveMatch();
}
function applyBoard(z, x, y) {
  const c = T(z, x, y);
  if (c !== 'W' && c !== 'w') return;
  W.floors[z].G[y][x] = 'X';
  const key = z + ':' + x + ':' + y;
  if (!M.boarded.includes(key)) M.boarded.push(key);
  saveMatch();
  aiSay('Try climbing through that now.');
  say('He boarded up a window.');
}

function routeHeat(z, x, y) { return M.route[z + ':' + (x | 0) + ',' + (y | 0)] || 0; }

function bestTrapSpot() {
  const cands = [];
  const seen = new Set();
  const push = (z, x, y, bonus) => {
    const k = z + ':' + x + ',' + y;
    if (seen.has(k)) return;
    seen.add(k);
    if (!isValidTrapCell(z, x, y)) return;
    let score = bonus;
    score += routeHeat(z, x, y) * 1.4;
    score += M.suspicion * 0.02;
    // chokepoints: next to a doorway
    let doors = 0;
    for (const [dx, dy] of NB4) if (doorAt(z, x + dx, y + dy)) doors++;
    score += doors * 5;
    // close to the player's usual objectives
    const g = playerGoal();
    if (g && g.z === z) score += Math.max(0, 8 - dst(x, y, g.x, g.y)) * 0.35;
    cands.push({ x, y, z, score });
  };
  // doorway approaches
  for (const d of W.doors) {
    for (const [x, y] of d.cells) for (const [dx, dy] of NB4) push(d.z, x + dx, y + dy, 3);
  }
  // where the player actually walks
  const route = Object.keys(M.route).map((k) => {
    const [z, xy] = k.split(':');
    const [x, y] = xy.split(',').map(Number);
    return { z: +z, x, y, v: M.route[k] };
  }).sort((a, b) => b.v - a.v).slice(0, 12);
  for (const r of route) push(r.z, r.x, r.y, r.v * 0.8);
  // belief peaks
  for (let z = 0; z < 3; z++) { const p = belPeak(z); if (p) push(z, p.x | 0, p.y | 0, 2); }
  cands.sort((a, b) => b.score - a.score);
  return cands[0] || null;
}

function planFortify() {
  // board a window the player has climbed through
  const entries = Object.keys(M.entries).map((k) => ({ k, n: M.entries[k] }))
    .filter((e) => !e.k.includes('D') && !M.boarded.includes(e.k)).sort((a, b) => b.n - a.n);
  for (const e of entries) {
    const [z, x, y] = e.k.split(':').map(Number);
    if (T(z, x, y) === 'w' || T(z, x, y) === 'W') { planBoardWindow(x, y, z); return 'board'; }
  }
  const trap = bestTrapSpot();
  if (trap) { runScript('place_trap', { x: trap.x, y: trap.y, z: trap.z }, 3); return 'trap'; }
  return null;
}

function planCamera() {
  if (!M.catches) return false;
  const top = Object.entries(M.entries).sort((a, b) => b[1] - a[1])[0];
  if (!top) return false;
  const [z, x, y] = top[0].split(':').map(Number);
  // a spot near the entry, facing it
  let best = null, bd = 1e9;
  for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
    const nx = x + dx, ny = y + dy;
    if (!standable(z, nx + 0.5, ny + 0.5, 0.28)) continue;
    if (dst(nx, ny, x, y) < 1.5) continue;
    const q = nearestStandable(z, nx, ny, 0.28);
    if (!q) continue;
    const d = dst(q[0], q[1], x, y);
    if (d < bd) { bd = d; best = { z, x: q[0], y: q[1] }; }
  }
  if (!best) return false;
  runScript('install_camera', { x: best.x, y: best.y, z: best.z }, 3);
  M.plans.push({ t: 'camera', x: best.x, y: best.y, z: best.z });
  saveMatch();
  return true;
}

/* --------------------------------------------------------------- schedule */
function hourWeight() {
  let total = 0, here = 0;
  for (let h = 0; h < 24; h++) { total += M.hours[h] || 0; if (h === (GAME.clock | 0)) here += M.hours[h] || 0; }
  return total > 0 ? clamp(here / total * 4, 0, 1) : 0;
}

/* ------------------------------------------------------------ routine tasks */
function pickTask() {
  if (GAME.state !== 'play' || !N) return;
  if (N.mode === 'chase' || N.mode === 'search') return;

  // urgent: relock a door he just saw opened, or one you picked
  if (considerRelock()) return;
  if (M.needRelock && M.needRelock.length) {
    const key = M.needRelock[0];
    const pp = String(key).split(':').map(Number);
    const d = doorAt(pp[0], pp[1], pp[2]);
    if (!d || !d.playerUnlocked) { M.needRelock.shift(); saveMatch(); }
    else {
      const q = nearestStandable(pp[0], pp[1], pp[2], 0.28);
      if (q) { runScript('relock_far', { x: q[0] + 0.5, y: q[1] + 0.5, z: pp[0], door: d }, 3); return; }
      M.needRelock.shift();
    }
  }

  // fortify when suspicion is high
  const wantFort = M.suspicion > 55 || M.catches > 0;
  if (M.plans.length) {
    const plan = M.plans.shift();
    if (plan.t === 'board') { runScript('board_window', plan, 3); return; }
    if (plan.t === 'guard') { runScript('guard_obj', { x: plan.x, y: plan.y, z: plan.z, what: 'the ' + plan.id }, 2); return; }
    if (plan.t === 'camera') { runScript('install_camera', plan, 3); return; }
    if (plan.t === 'tidy') {
      const it = ITEMS.find((q) => q.k === plan.k && q.taken && q.home);
      if (it) { runScript('tidy', { x: it.x, y: it.y, z: it.z, item: it }, 2); return; }
    }
  }
  if (wantFort && Math.random() < 0.5) {
    if (planFortify()) return;
    if (M.catches >= 2 && CAMS.length < 3 && Math.random() < 0.4 && planCamera()) return;
  }
  const hw = hourWeight();
  if (hw > 0.45 && M.suspicion > 22 && Math.random() < 0.55) {
    const ad = bestAmbushDoor();
    if (ad) { runScript('patrol', { a: [ad.x, ad.y, ad.z], b: [W.stations.front.x, W.stations.front.y, 0] }, 1); return; }
  }
  if (hw > 0.6 && M.suspicion > 35 && Math.random() < 0.3) { runScript('guard_cellar', {}, 2); return; }

  if (M.suspicion > 62 && Math.random() < 0.45) {
    const goal = playerGoal();
    if (goal && P.keys.red && P.keys.blue) { runScript('guard_cellar', {}, 2); return; }
    if (goal) { const q = nearestStandable(goal.z, goal.x, goal.y, 0.28); if (q) { runScript('guard_obj', { x: q[0] + 0.5, y: q[1] + 0.5, z: goal.z, what: 'the ' + (goal.z === 2 ? 'basement' : 'valuables') }, 2); return; } }
  }
  if (M.suspicion > 40 && Math.random() < 0.3) { runScript('check_valuables', {}, 1); return; }

  // routine tasks
  const hr = GAME.clock;
  let best = null, bestScore = -1e9;
  for (const t of TASKS) {
    const st = W.stations[t.st];
    if (!st) continue;
    let sc = 0;
    for (const k in t.eff) {
      const deficit = k === 'suspicion' ? M.suspicion / 100 : (N.need[k] || 0);
      const v = t.eff[k];
      sc += v < 0 ? deficit * (-v) * 0.16 : -v * 0.2;
    }
    if (t.hours) {
      const [a, b] = t.hours;
      const inWin = (hr >= a && hr < b) || (hr + 24 >= a && hr + 24 < b);
      sc += inWin ? 1.2 : -0.7;
    }
    const d = dst(N.x, N.y, st.x, st.y) + (N.z !== st.z ? 14 : 0);
    sc -= d * 0.03;
    if (N.recent.includes(t.n)) sc -= 1.1;
    // he roams: a chore in the room he is already in is less interesting
    const rm = roomAt(st.z, st.x, st.y);
    if (rm && N.lastRoom && rm.id === N.lastRoom) sc -= 1.0;
    if (N.lastRoom && rm && rm.id !== N.lastRoom) sc += 0.45;
    if (N.z !== st.z) sc += 0.9;               // he uses the whole house
    sc += Math.random() * 0.6;
    if (t.n === 'sleep' && !(hr >= 22 || hr < 6)) sc -= 3.5;
    if (t.n === 'sleep' && M.suspicion > 55) sc -= 1.2;
    if (sc > bestScore) { bestScore = sc; best = { t, st }; }
  }
  N.choreN = (N.choreN || 0) + 1;
  if (N.choreN % 4 === 0) {
    const a = bestAmbushDoor();
    const front = W.stations.front;
    if (a) {
      const alt = N.z === 0 ? { x: a.x, y: a.y, z: a.z } : { x: front.x, y: front.y, z: 0 };
      runScript('patrol', { a: [alt.x, alt.y, alt.z], b: [front.x, front.y, front.z] }, 1);
      N.lastRoom = null;
      return;
    }
  }
  if (!best) { runScript('idle', {}, 0); return; }
  const { t, st } = best;
  N.recent.push(t.n); if (N.recent.length > 6) N.recent.shift();
  const steps = [{ go: [st.x, st.y, st.z], label: t.n.replace(/_/g, ' ') }];
  if (t.n === 'sleep') steps.push({ fn: () => { N.sleeping = 1; } });
  steps.push({ wait: (t.a + Math.random() * (t.b - t.a)), label: t.n.replace(/_/g, ' ') + '…', eff: t.eff, sweep: t.n === 'sleep' ? 0 : 1 });
  if (t.n === 'sleep') steps.push({ fn: () => { N.sleeping = 0; } });
  steps.push({ fn: () => { N.done++; endScript(); } });
  N.st = t.n; N.script = steps; N.si = 0; N.path = []; N.prio = 0; N.goT = 0;
  N.speed = t.n === 'sleep' ? 2 : 2.35;
  const hr0 = roomAt(st.z, st.x, st.y);
  if (hr0) N.lastRoom = hr0.id;
  N.mode = N.mode === 'chase' ? 'chase' : 'routine';
}

/* ---------------------------------------------------- hit by a thrown object */
function aiHitByThrow(ox, oy, oz) {
  if (!N) return;
  N.stun = 1.6;
  N.al = 1;
  N.forensic = { x: ox, y: oy, z: oz, t: GAME.t };
  if (N.mode === 'chase') { N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t }; return; }
  N.mode = 'suspicious'; N.prio = 0; N.path = []; N.stepT = 0;
  N.script = SCRIPTS.wipe_face().concat(SCRIPTS.hunt_thrower({ x: ox, y: oy, z: oz }));
  N.si = 0; N.st = 'hunt_thrower'; N.label = 'TOMATO?!';
}

/* ------------------------------------------------------------------ update */
function aiUpdate(dt) {
  if (!N || GAME.state !== 'play') return;
  if (GAME.freezeAI) { N.dist = P ? dst(N.x, N.y, P.x, P.y) : 99; return; }
  GAME.t += dt;

  // needs drift
  N.need.hunger = clamp(N.need.hunger + dt * 0.004, 0, 1);
  N.need.thirst = clamp(N.need.thirst + dt * 0.005, 0, 1);
  N.need.boredom = clamp(N.need.boredom + dt * 0.006, 0, 1);
  N.need.energy = clamp(N.need.energy + dt * (N.sleeping ? -0.02 : 0.003), 0, 1);
  N.need.hygiene = clamp(N.need.hygiene + dt * 0.002, 0, 1);
  M.suspicion = clamp(M.suspicion - dt * 0.05, 0, 100);

  if (N.quipT > 0) N.quipT -= dt;
  if (GAME.msgT > 0) GAME.msgT -= dt;

  if (N.stun > 0) { N.stun -= dt; return; }

  perceive(dt);

  if (N.mode === 'chase') {
    updateChase(dt);
  } else {
    if (N.sees && N.al >= 1) {
      if (N.dist > 7.5 && !N.quiet) startQuietApproach();
      else startChase('seen');
    }
    if (N.mode === 'suspicious' && N.quiet && N.dist < 3.2 && N.sees) startChase('confirmed');
    if (N.mode === 'search') {
      N.searchT += dt;
      if (N.lastHeard && GAME.t - N.lastHeard.t < 1.2 && N.sees) { N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t }; }
    }
    scriptUpdate(dt);
  }

  // periodic: belief diffusion + theft noticing + camera checks
  N.bt = (N.bt || 0) + dt;
  if (N.bt > 0.5) { N.bt = 0; if (N.mode === 'search') belDiffuse(); checkTheftsNear(); }
  updateCameras(dt);

  // un-stick safety net
  N.unT = (N.unT || 0) + dt;
  if (N.unT > 0.3) {
    N.unT = 0;
    if (!standable(N.z, N.x, N.y, 0.27)) {
      const q = nearestStandable(N.z, N.x, N.y, 0.29);
      if (q) { N.x = q[0] + 0.5; N.y = q[1] + 0.5; N.path = []; }
    }
  }
  // lights follow him at night
  if (isNight(GAME.clock)) {
    const r = roomAt(N.z, N.x, N.y);
    for (const F of W.floors) for (const room of F.rooms) {
      const isHere = r && room.id === r.id && F.z === N.z;
      room.light = isHere || (room.light && Math.random() > 0.002);
    }
  } else {
    for (const F of W.floors) for (const room of F.rooms) room.light = 1;
  }
}

/* ----------------------------------------------------------------- cameras */
const CAM_RANGE = 7, CAM_FOV = 0.7;
function updateCameras(dt) {
  for (const c of CAMS) {
    c.a += dt * (c.sweep == null ? 1 : c.sweep);
    c.cd -= dt;
    if (c.z !== P.z) continue;
    const d = dst(c.x, c.y, P.x, P.y);
    if (d > CAM_RANGE) continue;
    const ang = Math.atan2(P.y - c.y, P.x - c.x);
    const off = Math.abs(Math.atan2(Math.sin(ang - c.a), Math.cos(ang - c.a)));
    if (off > CAM_FOV) continue;
    if (!lineOfSight({ x: c.x, y: c.y, z: c.z }, { x: P.x, y: P.y, z: P.z })) continue;
    c.seeT += dt;
    if (c.seeT > 1.0 && c.cd <= 0) { c.cd = 5; makeNoise(c.x, c.y, c.z, 11, 'camera'); say('A camera spotted you!'); }
  }
}

const AI = {
  initAI, aiUpdate, hearNoise, startChase, startSearch, startQuietApproach,
  belAdd, belSeed, belSpots, belPeak, belDiffuse, belClear, belTotal,
  pickTask, runScript, updateChase, cutoffTarget, playerGoal,
  bestTrapSpot, planFortify, planCamera, isValidTrapCell, addTrap,
  checkTheftsNear, considerRelock, applyRelock, applyBoard, planBoardWindow, visibleSpot,
  sightRange, lineOfSight, roomNameAt, hourWeight, bestAmbushDoor, routeHeat,
