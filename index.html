function runScript(name, params, prio) {
  const build = SCRIPTS[name];
  if (!build) return;
  N.st = name;
  N.script = build(params || {});
  N.si = 0; N.stepT = 0; N.path = []; N.prio = prio || 0;
  N.label = (N.script[0] && N.script[0].label) || '';
}
function endScript() {
  N.script = []; N.si = 0; N.prio = 0;
  if (N.mode === 'search') { searchNext(); return; }
  N.mode = 'routine';
  pickTask();
}

function scriptUpdate(dt) {
  if (!N.script.length) { endScript(); return; }
  const sc = N.script, idx = N.si;
  const s = sc[idx];
  if (!s) { endScript(); return; }
  // A step may install a whole new script (endScript/pickTask/runScript). Only
  // advance the cursor if we are still looking at the same step afterwards.
  const advance = () => {
    if (N.script === sc && N.si === idx) N.si = idx + 1;
    N.stepT = 0; N.goT = 0;
  };
  if (s.go) {
    if (N.repath || !N.path.length) {
      N.repath = 0;
      if (!goTo(s.go[0], s.go[1], s.go[2])) { advance(); return; }
    }
    N.label = s.label || N.label;
    if (followPath(dt, N.speed || 2.4)) { advance(); return; }
    N.goT = (N.goT || 0) + dt;
    if (N.goT > 22) { N.path = []; advance(); }
  } else if (s.wait != null) {
    N.stepT += dt;
    N.label = s.label || '';
    if (s.face) turnTo(Math.atan2(s.face[1] - N.y, s.face[0] - N.x), dt, 5);
    else if (s.faceP) turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 5);
    else if (s.sweep && !N.locked) N.a += Math.sin(GAME.t * 2.6) * dt * 1.8;
    if (s.eff) for (const k in s.eff) N.need[k] = clamp((N.need[k] || 0) + s.eff[k] / s.wait, 0, 1);
    if (N.stepT >= s.wait) advance();
  } else if (s.fn) { s.fn(); advance(); }
}

/* ------------------------------------------------------------- search mode */
function startSearch(reason) {
  if (N.mode === 'chase' && reason !== 'lost') return;
  N.mode = 'search';
  N.mode = 'search'; N.searchT = 0; N.searchN = 0; N.cleared = []; N.prio = 0;
  N.searchReason = reason || 'lost';
  belSeed();
  aiSay('I know you are still in here.');
  searchNext();
}
function endSearchStep() {
  N.searchN++;
  if (N.mode === 'search') searchNext();
}
function searchNext() {
  if (N.mode !== 'search') return;
  if (N.searchT > 34) { N.mode = 'routine'; runScript('calm_down', {}, 1); return; }
  const total = belTotal(N.z) + belTotal(0) * 0.3 + belTotal(1) * 0.3;
  if (total < 0.05) { N.mode = 'routine'; runScript('calm_down', {}, 1); return; }

  // every third step: chokepoint ambush instead of sweeping
  if (N.searchN > 0 && N.searchN % 3 === 0) {
    const door = bestAmbushDoor();
    if (door) {
      runScript('ambush_door', { x: door.x, y: door.y, z: door.z, fx: door.fx, fy: door.fy }, 2);
      N.ambush = (N.ambush || 0) + 1;
      return;
    }
  }
  const spots = belSpots(N.z, 6).concat(belSpots(0, 3), belSpots(1, 3)).sort((a, b) => b.s - a.s);
  for (const s of spots) {
    if (goTo(s.x, s.y, s.z)) { runScript('search_spot', { x: s.x, y: s.y, z: s.z }, 2); return; }
  }
  N.mode = 'routine'; runScript('calm_down', {}, 1);
}

function bestAmbushDoor() {
  const peak = belPeak(N.z) || belPeak(0) || belPeak(1);
  if (!peak) return null;
  let best = null, bd = 1e9;
  for (const d of W.doors) {
    if (d.kind === 'lock' || d.kind === 'cellar') continue;
    for (const [x, y] of d.cells) {
      const dist = dst(x, y, peak.x, peak.y);
      if (dist < bd && dist < 26) {
        const q = nearestStandable(d.z, x, y, 0.28);
        if (q) { bd = dist; best = { x: q[0] + 0.5, y: q[1] + 0.5, z: d.z, fx: x + 0.5, fy: y + 0.5 }; }
      }
    }
  }
  return best;
}

/* ------------------------------------------------------------- chase mode */
function startChase(reason) {
  if (N.mode === 'chase') return;
  N.mode = 'chase'; N.chaseT = 0; N.lostT = 0; N.quiet = 0;
  N.script = []; N.prio = 4; N.path = []; N.sleeping = 0;
  M.catches = M.catches; // no change here; catches only on a real catch
  M.suspicion = Math.min(100, M.suspicion + 6);
  aiSay('GOTCHA!');
  say('He spotted you — RUN!');
  addHeatRoute();
}
function startQuietApproach() {
  N.mode = 'suspicious'; N.quiet = 1;
  runScript('follow_sound', { x: P.x, y: P.y, z: P.z }, 2);
  aiSay('I can hear you breathing…');
}
function addHeatRoute() { if (P) M.route[P.z + ':' + (P.x | 0) + ',' + (P.y | 0)] = (M.route[P.z + ':' + (P.x | 0) + ',' + (P.y | 0)] || 0) + 3; }

/* ------------------------------------------------------------------------
   The chase. Three rules matter here:
   1. while he can see you the map already sits on you (belStep collapses it);
      the moment he loses you he chases the belief, not the memory;
   2. one target at a time, held long enough to walk to it — switching every
      frame is what made him twitch left and right;
   3. every sight test goes through lineOfSight, so he never acquires you
      through a wall or a closed door.
   ------------------------------------------------------------------------ */
function chaseTargetFor(d, clear) {
  // close and clear: go straight at you
  if (clear && d < 4.6) return { x: P.x, y: P.y, z: P.z, direct: 1 };
  // he can see you, you are further away: cut you off — but only if that is
  // actually shorter than just running at you
  if (clear) {
    const cut = cutoffTarget(d);
    const cutD = dst(N.x, N.y, cut.x, cut.y) + Math.abs(N.z - cut.z) * 9;
    if (cut.z === P.z && cutD < d * 1.05 && cutD < 14) return cut;
    return { x: P.x, y: P.y, z: P.z };
  }
  // he lost you: the first second is your own momentum, after that the map
  if (N.lostT < 0.9 && N.lastSeen) {
    const ls = N.lastSeen;
    const px = ls.x + clamp(N.pvel.x, -6, 6) * 0.5;
    const py = ls.y + clamp(N.pvel.y, -6, 6) * 0.5;
    if (walkCell(ls.z, px | 0, py | 0)) return { x: px, y: py, z: ls.z };
    return { x: ls.x, y: ls.y, z: ls.z };
  }
  // he lost you on the stairs: assume you took them
  if (N.lostT > 0.6 && N.lastSeen) {
    const up = stairNear(N.lastSeen.x, N.lastSeen.y, N.lastSeen.z, 3.2);
    if (up && up.z !== N.z) {
      const other = belCentroid(up.z, N.conf);
      if (other && dst(other.x, other.y, up.x + 0.5, up.y + 0.5) < 7) return other;
      return { x: up.x + 0.5, y: up.y + 0.5, z: up.z };
    }
  }
  // belief: the likeliest place you can actually be by now, on his floor
  const c = belCentroid(N.z, N.conf);
  if (c) return c;
  // the other floor: only worth a climb when the heat is really up there and
  // there is nothing left to look at on this one
  if (N.lostT > 2.5) {
    for (const zz of [0, 1]) {
      if (zz === N.z) continue;
      const mine = belTotal(N.z), theirs = belTotal(zz);
      if (theirs > 0.5 && theirs > mine * 2.2) {
        const b = belCentroid(zz, N.conf);
        if (b) return b;
      }
    }
  }
  if (N.lastSeen) {
    const q = nearestStandable(N.lastSeen.z, N.lastSeen.x | 0, N.lastSeen.y | 0, 0.3);
    if (q) return { x: q[0] + 0.5, y: q[1] + 0.5, z: N.lastSeen.z };
  }
  return null;
}

function updateChase(dt) {
  N.chaseT += dt;
  const same = N.z === P.z;
  const d = same ? dst(N.x, N.y, P.x, P.y) : 99;
  N.dist = d;
  const clear = same && lineOfSight(N, P);

  // the belief map is alive for the whole chase, not just after it
  belStep(dt);

  if (N.sees && clear) {
    N.lostT = 0;
    N.conf = 1;
    N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t };
    addHeatRoute();
  } else {
    N.lostT += dt;
    N.conf = Math.max(0.12, 1 - N.lostT / 8);
    // while the sighting is fresh he keeps expecting you just beyond it
    if (N.lastSeen) belAnchor(N.lastSeen, Math.max(0.1, 0.75 - N.lostT * 0.11) * dt * 3.2);
    // ...and if that sighting was on the stairs, the map straddles both floors
    N.stairPulse = (N.stairPulse || 0) + dt;
    if (N.lastSeen && N.stairPulse > 0.5) {
      N.stairPulse = 0;
      const up = stairNear(N.lastSeen.x, N.lastSeen.y, N.lastSeen.z, 3.2);
      if (up) { belAdd(up.z, up.x + 0.5, up.y + 0.5, 0.35); belNormalizeMass(); }
    }
  }

  // ---- direct or pathing? hysteresis so he does not flip every frame
  const wantDirect = clear && P.z === N.z && d < (N.cmode === 'direct' ? 7.6 : 4.6);
  N.cmode = wantDirect ? 'direct' : 'path';
  N.speed = 3.6 + Math.min(0.45, M.catches * 0.09);

  if (N.cmode === 'direct') {
    N.path = [];
    N.ct = null;
    N.label = d < 2.6 ? 'LUNGE!' : 'get back here!';
    N.speed = 3.55 + Math.min(0.45, M.catches * 0.09) + (d < 2.6 ? 0.2 : 0);
    turnTo(Math.atan2(P.y - N.y, P.x - N.x), dt, 11);
    const step = N.speed * dt;
    const ox = N.x, oy = N.y;
    moveCircle(N, Math.cos(N.a) * step, Math.sin(N.a) * step, 0.29);
    if (dst(ox, oy, N.x, N.y) < step * 0.2) {
      N.blockT = (N.blockT || 0) + dt;
      if (N.blockT > 0.4) { N.blockT = 0; N.retarget = 1; N.path = []; N.cmode = 'path'; }
    } else N.blockT = 0;
  } else {
    N.retargetT = (N.retargetT || 0) - dt;
    if (N.retargetT <= 0 || N.retarget || !N.path.length) {
      const want = chaseTargetFor(d, clear);
      N.retargetT = 0.45;
      if (want) {
        const moved = !N.ct || want.z !== N.ct.z || dst(want.x, want.y, N.ct.x, N.ct.y) > 1.6;
        // only change his mind for a materially better spot, or when the old
        // one is gone / unreachable
        if (moved || N.retarget || !N.path.length) {
          const ok = goTo(want.x, want.y, want.z);
          // hold the target even if the path failed: the straight-line fallback
          // below keeps him moving instead of freezing on the spot
          N.ct = { x: want.x, y: want.y, z: want.z };
          N.retarget = 0;
          if (!ok) N.path = [];
        }
      }
    }
    // arrived at the spot he was heading for? stop staring at it
    if (N.ct && N.z === N.ct.z && dst(N.x, N.y, N.ct.x, N.ct.y) < 0.9) {
      N.arriveN = (N.arriveN || 0) + 1;
      N.ct = null; N.path = []; N.retarget = 1; N.retargetT = 0;
    }
    if (!N.path.length && N.ct) goTo(N.ct.x, N.ct.y, N.ct.z);
    N.label = clear ? 'cutting you off!' : N.lostT > 0.7 ? 'where did you go?' : 'cutting you off!';
    const before = { x: N.x, y: N.y };
    followPath(dt, N.speed);
    // nothing walkable to him: move straight at the target rather than freeze
    if (!N.path.length && N.ct && Math.hypot(N.x - before.x, N.y - before.y) < 0.004) {
      const ang = Math.atan2(N.ct.y - N.y, N.ct.x - N.x);
      turnTo(ang, dt, 8);
      moveCircle(N, Math.cos(ang) * N.speed * dt, Math.sin(ang) * N.speed * dt, 0.29);
    }
    // he reached the spot he believes in: stop chasing the memory and sweep
    if (!N.sees && N.ct && N.lostT > 3 && N.lastSeen && N.ct.z === N.lastSeen.z &&
        N.z === N.ct.z && dst(N.x, N.y, N.ct.x, N.ct.y) < 1.5) {
      startSearch('trail');
      return;
    }
  }

  // ---- watchdog: never let him grind against the same corner
  N.wt = (N.wt || 0) + dt;
  if (N.wt > 0.5) {
    const moved = dst(N.wx == null ? N.x : N.wx, N.wy == null ? N.y : N.wy, N.x, N.y);
    if (moved < 0.3 && N.cmode !== 'direct') {
      N.stuckN = (N.stuckN || 0) + 1;
      N.path = []; N.retarget = 1; N.retargetT = 0;
      if (N.stuckN >= 2) {
        // step off the wall he is grinding on, then pick a fresh target
        N.stuckN = 0;
        for (const [dx, dy] of NB4) {
          if (walkCell(N.z, (N.x + dx) | 0, (N.y + dy) | 0)) {
            moveCircle(N, dx * 0.45, dy * 0.45, 0.28);
            break;
          }
        }
        N.ct = null;
        const spot = belCentroid(N.z, Math.min(0.5, N.conf)) || (N.lastSeen && { x: N.lastSeen.x, y: N.lastSeen.y, z: N.lastSeen.z });
        if (spot) goTo(spot.x, spot.y, spot.z);
      }
    } else N.stuckN = 0;
    N.wx = N.x; N.wy = N.y; N.wt = 0;
  }

  // ---- throws, only with a real line of sight
  if (N.throwCd === undefined) N.throwCd = 2;
  N.throwCd -= dt;
  if (d > 3.2 && d < 9.5 && clear && N.throwCd <= 0) { nThrow(); N.throwCd = 3.2 - Math.min(1.2, M.catches * 0.2); }

  if (N.sees && d > 9) N.label = 'cutting you off!';

  // a catch only happens when he is actually on you — never through a wall
  if (same && d < 0.95 && (clear || d < 0.45)) catchPlayer();

  if (!N.sees && N.lostT > 6.5) {
    N.mode = 'suspicious';
    startSearch('lost');
  }
}

function cutoffTarget(fallbackDist) {
  const goal = playerGoal();
  if (!goal) return { x: P.x, y: P.y, z: P.z };
  // the route he believes you are taking to your objective...
  const route = pathFind({ x: P.x, y: P.y, z: P.z }, goal, { allowClosed: 1 });
  if (route.length < 2) return { x: P.x, y: P.y, z: P.z };
  // ...and the first point on it he can beat you to.
  let best = null, bestScore = 1e9;
  for (let i = 0; i < route.length; i++) {
    const q = route[i];
    const floorGap = Math.abs(N.z - q.z) * 9;
    const nd = dst(N.x, N.y, q.x + 0.5, q.y + 0.5) + floorGap;
    if (nd > 14 || nd < 1.6) continue;        // too far, or he is already there
    if (q.z !== P.z) continue;                // a local cut-off, not a commute
    const pd = dst(P.x, P.y, q.x + 0.5, q.y + 0.5) + Math.abs(P.z - q.z) * 9;
    const lead = pd - nd;
    if (lead < 1.0) continue;                 // he cannot be there first
    const score = lead * 3 - nd * 0.6;
    if (score < bestScore) {
      bestScore = score;
      best = { x: q.x + 0.5, y: q.y + 0.5, z: q.z };
    }
  }
  if (best) return best;
  // nowhere better to wait: go for where you are right now
  return { x: P.x, y: P.y, z: P.z };
}

function nThrow() {
  const speed = 9.5;
  const d = Math.max(1, N.dist);
  const t = d / speed;
  const px = P.x + P.vx * t * 0.6, py = P.y + P.vy * t * 0.6;
  const dx = px - N.x, dy = py - N.y, l = Math.hypot(dx, dy) || 1;
  spawnProjectile(Math.random() < 0.5 ? 'tomato' : 'box', N.x + dx / l * 0.5, N.y + dy / l * 0.5, N.z, dx / t, dy / t, 3.6, 'n');
  aiSay('Take that!');
}

function catchPlayer() {
  if (GAME.state !== 'play') return;
  GAME.state = 'over';
  UI.over = 'caught';
  M.catches++;
  M.suspicion = Math.min(100, M.suspicion + 15);
  M.rooms[roomNameAt(P.z, P.x, P.y)] = (M.rooms[roomNameAt(P.z, P.x, P.y)] || 0) + 2;
  M.hours[GAME.clock | 0] = (M.hours[GAME.clock | 0] || 0) + 2;
  M.hides.push({ x: P.x, y: P.y, z: P.z });
  if (M.hides.length > 12) M.hides.shift();
  saveMatch();
  UI.screen = 'over';
}

/* --------------------------------------------------------------- player goal */
function playerGoal() {
  if (!P) return null;
  const byId = {};
  for (const c of W.containers) byId[c.id] = c;
  if (!P.keys.pick && byId.toolbox) return { x: byId.toolbox.x, y: byId.toolbox.y, z: byId.toolbox.z };
  if (!P.keys.red && byId.fridge) return { x: byId.fridge.x, y: byId.fridge.y, z: byId.fridge.z };
  if (!P.keys.blue && byId.desk) return { x: byId.desk.x, y: byId.desk.y, z: byId.desk.z };
  return { x: W.secret.x, y: W.secret.y, z: W.secret.z };
}

/* ----------------------------------------------------------------- thefts */
function visibleSpot(z, x, y) {
  // furniture is solid, so sight-check to the floor tile in front of it
  if (freeCell(z, x | 0, y | 0)) return { x: x | 0, y: y | 0, z };
  for (let rad = 1; rad <= 3; rad++) {
    for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== rad) continue;
      if (freeCell(z, (x | 0) + dx, (y | 0) + dy)) return { x: (x | 0) + dx, y: (y | 0) + dy, z };
    }
  }
  return { x: x | 0, y: y | 0, z };
}
function checkTheftsNear(force) {
  if (!N) return;
  // emptied containers
  for (const c of W.containers) {
    if (!c.done || c.seen) continue;
    const sameFloor = c.z === N.z;
    const spot = visibleSpot(c.z, c.tx + (c.w || 1) / 2, c.ty);
    const near = sameFloor ? dst(N.x, N.y, c.x, c.y) < 12 && lineOfSight(N, spot) : force;
    if (!near) continue;
    c.seen = 1;
    M.thefts.push(c.id);
    M.suspicion = Math.min(100, M.suspicion + 14);
    aiSay('Someone has been in my ' + c.label + '!');
    say('He noticed the ' + c.label + ' had been searched.');
    M.plans.push({ t: 'guard', id: c.id, x: c.x, y: c.y, z: c.z });
    saveMatch();
  }
  // moved or missing loose objects
  for (const it of ITEMS) {
    if (it.noticed || !it.home) continue;
    if (it.x === it.home.x && it.y === it.home.y && it.z === it.home.z) continue;
    const near = it.z === N.z && dst(N.x, N.y, it.home.x, it.home.y) < 9 && lineOfSight(N, visibleSpot(it.z, it.home.x, it.home.y));
    if (!near) continue;
    it.noticed = 1;
    M.suspicion = Math.min(100, M.suspicion + 9);
    M.plans.push({ t: 'tidy', k: it.k });
    aiSay('My ' + it.k + ' is gone!');
    say('He noticed his ' + it.k + ' was missing.');
  }
}

/* ------------------------------------------------------------ re-locking */
function considerRelock() {
  for (const d of W.doors) {
    if (!d.playerUnlocked) continue;
    if (d.z !== N.z) continue;
    for (const [x, y] of d.cells) {
      if (dst(N.x, N.y, x + 0.5, y + 0.5) > 1.6) continue;
      const q = nearestStandable(d.z, x, y, 0.28);
      if (!q) continue;
      runScript('relock', { x: q[0], y: q[1], z: d.z, door: d }, 2);
      return true;
    }
  }
  return false;
}
function applyRelock(p) {
  const d = p.door;
  d.closed = 1;
  d.playerUnlocked = 0;
  for (const [x, y] of d.cells) W.floors[d.z].G[y][x] = d.lockChar || 'L';
  M.suspicion = Math.min(100, M.suspicion + 4);
  M.relocks.push(d.z + ':' + d.cells[0][0] + ':' + d.cells[0][1]);
  saveMatch();
  aiSay('Locked. Try that again.');
  say('He re-locked the door.');
}

/* ------------------------------------------------------------ fortification */
function planBoardWindow(x, y, z) {
  const key = z + ':' + x + ':' + y;
  if (M.plans.some((p) => p.t === 'board' && p.x === x && p.y === y && p.z === z)) return;
  M.plans.push({ t: 'board', x, y, z });
  saveMatch();
}
function applyBoard(z, x, y) {
  const c = T(z, x, y);
  if (c !== 'W' && c !== 'w') return;
  W.floors[z].G[y][x] = 'X';
  const key = z + ':' + x + ':' + y;
  if (!M.boarded.includes(key)) M.boarded.push(key);
  saveMatch();
  aiSay('Try climbing through that now.');
  say('He boarded up a window.');
}

function routeHeat(z, x, y) { return M.route[z + ':' + (x | 0) + ',' + (y | 0)] || 0; }

function bestTrapSpot() {
  const cands = [];
  const seen = new Set();
  const push = (z, x, y, bonus) => {
    const k = z + ':' + x + ',' + y;
    if (seen.has(k)) return;
    seen.add(k);
    if (!isValidTrapCell(z, x, y)) return;
    let score = bonus;
    score += routeHeat(z, x, y) * 1.4;
    score += M.suspicion * 0.02;
    // chokepoints: next to a doorway
    let doors = 0;
    for (const [dx, dy] of NB4) if (doorAt(z, x + dx, y + dy)) doors++;
    score += doors * 5;
    // close to the player's usual objectives
    const g = playerGoal();
    if (g && g.z === z) score += Math.max(0, 8 - dst(x, y, g.x, g.y)) * 0.35;
    cands.push({ x, y, z, score });
  };
  // doorway approaches
  for (const d of W.doors) {
    for (const [x, y] of d.cells) for (const [dx, dy] of NB4) push(d.z, x + dx, y + dy, 3);
  }
  // where the player actually walks
  const route = Object.keys(M.route).map((k) => {
    const [z, xy] = k.split(':');
    const [x, y] = xy.split(',').map(Number);
    return { z: +z, x, y, v: M.route[k] };
  }).sort((a, b) => b.v - a.v).slice(0, 12);
  for (const r of route) push(r.z, r.x, r.y, r.v * 0.8);
  // belief peaks
  for (let z = 0; z < 2; z++) { const p = belPeak(z); if (p) push(z, p.x | 0, p.y | 0, 2); }
  cands.sort((a, b) => b.score - a.score);
  return cands[0] || null;
}

function planFortify() {
  // board a window the player has climbed through
  const entries = Object.keys(M.entries).map((k) => ({ k, n: M.entries[k] }))
    .filter((e) => !e.k.includes('D') && !M.boarded.includes(e.k)).sort((a, b) => b.n - a.n);
  for (const e of entries) {
    const [z, x, y] = e.k.split(':').map(Number);
    if (T(z, x, y) === 'w' || T(z, x, y) === 'W') { planBoardWindow(x, y, z); return 'board'; }
  }
  const trap = bestTrapSpot();
  if (trap) { runScript('place_trap', { x: trap.x, y: trap.y, z: trap.z }, 3); return 'trap'; }
  return null;
}

function planCamera() {
  if (!M.catches) return false;
  const top = Object.entries(M.entries).sort((a, b) => b[1] - a[1])[0];
  if (!top) return false;
  const [z, x, y] = top[0].split(':').map(Number);
  // a spot near the entry, facing it
  let best = null, bd = 1e9;
  for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
    const nx = x + dx, ny = y + dy;
    if (!standable(z, nx + 0.5, ny + 0.5, 0.28)) continue;
    if (dst(nx, ny, x, y) < 1.5) continue;
    const q = nearestStandable(z, nx, ny, 0.28);
    if (!q) continue;
    const d = dst(q[0], q[1], x, y);
    if (d < bd) { bd = d; best = { z, x: q[0], y: q[1] }; }
  }
  if (!best) return false;
  runScript('install_camera', { x: best.x, y: best.y, z: best.z }, 3);
  M.plans.push({ t: 'camera', x: best.x, y: best.y, z: best.z });
  saveMatch();
  return true;
}

/* --------------------------------------------------------------- schedule */
function hourWeight() {
  let total = 0, here = 0;
  for (let h = 0; h < 24; h++) { total += M.hours[h] || 0; if (h === (GAME.clock | 0)) here += M.hours[h] || 0; }
  return total > 0 ? clamp(here / total * 4, 0, 1) : 0;
}

/* ------------------------------------------------------------ routine tasks */
function pickTask() {
  if (GAME.state !== 'play' || !N) return;
  if (N.mode === 'chase' || N.mode === 'search') return;

  // urgent: relock a door he just saw opened, or one you picked
  if (considerRelock()) return;
  if (M.needRelock && M.needRelock.length) {
    const key = M.needRelock[0];
    const pp = String(key).split(':').map(Number);
    const d = doorAt(pp[0], pp[1], pp[2]);
    if (!d || !d.playerUnlocked) { M.needRelock.shift(); saveMatch(); }
    else {
      const q = nearestStandable(pp[0], pp[1], pp[2], 0.28);
      if (q) { runScript('relock_far', { x: q[0] + 0.5, y: q[1] + 0.5, z: pp[0], door: d }, 3); return; }
      M.needRelock.shift();
    }
  }

  // fortify when suspicion is high
  const wantFort = M.suspicion > 55 || M.catches > 0;
  if (M.plans.length) {
    const plan = M.plans.shift();
    if (plan.t === 'board') { runScript('board_window', plan, 3); return; }
    if (plan.t === 'guard') { runScript('guard_obj', { x: plan.x, y: plan.y, z: plan.z, what: 'the ' + plan.id }, 2); return; }
    if (plan.t === 'camera') { runScript('install_camera', plan, 3); return; }
    if (plan.t === 'tidy') {
      const it = ITEMS.find((q) => q.k === plan.k && q.taken && q.home);
      if (it) { runScript('tidy', { x: it.x, y: it.y, z: it.z, item: it }, 2); return; }
    }
  }
  if (wantFort && Math.random() < 0.5) {
    if (planFortify()) return;
    if (M.catches >= 2 && CAMS.length < 3 && Math.random() < 0.4 && planCamera()) return;
  }
  const hw = hourWeight();
  if (hw > 0.45 && M.suspicion > 22 && Math.random() < 0.55) {
    const ad = bestAmbushDoor();
    if (ad) { runScript('patrol', { a: [ad.x, ad.y, ad.z], b: [W.stations.front.x, W.stations.front.y, 0] }, 1); return; }
  }
  if (hw > 0.6 && M.suspicion > 35 && Math.random() < 0.3) { runScript('guard_cellar', {}, 2); return; }

  if (M.suspicion > 62 && Math.random() < 0.45) {
    const goal = playerGoal();
    if (goal && P.keys.red && P.keys.blue) { runScript('guard_cellar', {}, 2); return; }
    if (goal) { const q = nearestStandable(goal.z, goal.x, goal.y, 0.28); if (q) { runScript('guard_obj', { x: q[0] + 0.5, y: q[1] + 0.5, z: goal.z, what: 'the valuables' }, 2); return; } }
  }
  if (M.suspicion > 40 && Math.random() < 0.3) { runScript('check_valuables', {}, 1); return; }

  // routine tasks
  const hr = GAME.clock;
  let best = null, bestScore = -1e9;
  for (const t of TASKS) {
    const st = W.stations[t.st];
    if (!st) continue;
    let sc = 0;
    for (const k in t.eff) {
      const deficit = k === 'suspicion' ? M.suspicion / 100 : (N.need[k] || 0);
      const v = t.eff[k];
      sc += v < 0 ? deficit * (-v) * 0.16 : -v * 0.2;
    }
    if (t.hours) {
      const [a, b] = t.hours;
      const inWin = (hr >= a && hr < b) || (hr + 24 >= a && hr + 24 < b);
      sc += inWin ? 1.2 : -0.7;
    }
    const d = dst(N.x, N.y, st.x, st.y) + (N.z !== st.z ? 14 : 0);
    sc -= d * 0.03;
    if (N.recent.includes(t.n)) sc -= 1.1;
    // he roams: a chore in the room he is already in is less interesting
    const rm = roomAt(st.z, st.x, st.y);
    if (rm && N.lastRoom && rm.id === N.lastRoom) sc -= 1.0;
    if (N.lastRoom && rm && rm.id !== N.lastRoom) sc += 0.45;
    if (N.z !== st.z) sc += 0.9;               // he uses the whole house
    sc += Math.random() * 0.6;
    if (t.n === 'sleep' && !(hr >= 22 || hr < 6)) sc -= 3.5;
    if (t.n === 'sleep' && M.suspicion > 55) sc -= 1.2;
    if (sc > bestScore) { bestScore = sc; best = { t, st }; }
  }
  N.choreN = (N.choreN || 0) + 1;
  if (N.choreN % 4 === 0) {
    const a = bestAmbushDoor();
    const front = W.stations.front;
    if (a) {
      const alt = N.z === 0 ? { x: a.x, y: a.y, z: a.z } : { x: front.x, y: front.y, z: 0 };
      runScript('patrol', { a: [alt.x, alt.y, alt.z], b: [front.x, front.y, front.z] }, 1);
      N.lastRoom = null;
      return;
    }
  }
  if (!best) { runScript('idle', {}, 0); return; }
  const { t, st } = best;
  N.recent.push(t.n); if (N.recent.length > 6) N.recent.shift();
  const steps = [{ go: [st.x, st.y, st.z], label: t.n.replace(/_/g, ' ') }];
  if (t.n === 'sleep') steps.push({ fn: () => { N.sleeping = 1; } });
  steps.push({ wait: (t.a + Math.random() * (t.b - t.a)), label: t.n.replace(/_/g, ' ') + '…', eff: t.eff, sweep: t.n === 'sleep' ? 0 : 1 });
  if (t.n === 'sleep') steps.push({ fn: () => { N.sleeping = 0; } });
  steps.push({ fn: () => { N.done++; endScript(); } });
  N.st = t.n; N.script = steps; N.si = 0; N.path = []; N.prio = 0; N.goT = 0;
  N.speed = t.n === 'sleep' ? 2 : 2.35;
  const hr0 = roomAt(st.z, st.x, st.y);
  if (hr0) N.lastRoom = hr0.id;
  N.mode = N.mode === 'chase' ? 'chase' : 'routine';
}

/* ---------------------------------------------------- hit by a thrown object */
function aiHitByThrow(ox, oy, oz) {
  if (!N) return;
  N.stun = 1.6;
  N.al = 1;
  N.forensic = { x: ox, y: oy, z: oz, t: GAME.t };
  if (N.mode === 'chase') { N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t }; return; }
  N.mode = 'suspicious'; N.prio = 0; N.path = []; N.stepT = 0;
  N.script = SCRIPTS.wipe_face().concat(SCRIPTS.hunt_thrower({ x: ox, y: oy, z: oz }));
  N.si = 0; N.st = 'hunt_thrower'; N.label = 'TOMATO?!';
}

/* ------------------------------------------------------------------ update */
function aiUpdate(dt) {
  if (!N || GAME.state !== 'play') return;
  if (GAME.freezeAI) { N.dist = P ? dst(N.x, N.y, P.x, P.y) : 99; return; }
  GAME.t += dt;

  // needs drift
  N.need.hunger = clamp(N.need.hunger + dt * 0.004, 0, 1);
  N.need.thirst = clamp(N.need.thirst + dt * 0.005, 0, 1);
  N.need.boredom = clamp(N.need.boredom + dt * 0.006, 0, 1);
  N.need.energy = clamp(N.need.energy + dt * (N.sleeping ? -0.02 : 0.003), 0, 1);
  N.need.hygiene = clamp(N.need.hygiene + dt * 0.002, 0, 1);
  M.suspicion = clamp(M.suspicion - dt * 0.05, 0, 100);

  if (N.quipT > 0) N.quipT -= dt;
  if (GAME.msgT > 0) GAME.msgT -= dt;

  if (N.stun > 0) { N.stun -= dt; return; }

  perceive(dt);

  if (N.mode === 'chase') {
    updateChase(dt);
  } else {
    if (N.sees && N.al >= 1) {
      if (N.dist > 7.5 && !N.quiet) startQuietApproach();
      else startChase('seen');
    }
    if (N.mode === 'suspicious' && N.quiet && N.dist < 3.2 && N.sees) startChase('confirmed');
    if (N.mode === 'search') {
      N.searchT += dt;
      if (N.lastHeard && GAME.t - N.lastHeard.t < 1.2 && N.sees) { N.lastSeen = { x: P.x, y: P.y, z: P.z, t: GAME.t }; }
    }
    scriptUpdate(dt);
  }

  // periodic: belief diffusion + theft noticing + camera checks
  N.bt = (N.bt || 0) + dt;
  if (N.bt > 0.5) {
    N.bt = 0;
    if (N.mode === 'search') belStep(0.5);
    else if (N.mode !== 'chase' && belTotal(0) + belTotal(1) > 0.001) belStep(0.12);
    checkTheftsNear();
  }
  updateCameras(dt);

  // un-stick safety net
  N.unT = (N.unT || 0) + dt;
  if (N.unT > 0.3) {
    N.unT = 0;
    if (!standable(N.z, N.x, N.y, 0.27)) {
      const q = nearestStandable(N.z, N.x, N.y, 0.29);
      if (q) { N.x = q[0] + 0.5; N.y = q[1] + 0.5; N.path = []; }
    }
  }
  // lights follow him at night
  if (isNight(GAME.clock)) {
    const r = roomAt(N.z, N.x, N.y);
    for (const F of W.floors) for (const room of F.rooms) {
      const isHere = r && room.id === r.id && F.z === N.z;
      room.light = isHere || (room.light && Math.random() > 0.002);
    }
  } else {
    for (const F of W.floors) for (const room of F.rooms) room.light = 1;
  }
}

/* ----------------------------------------------------------------- cameras */
const CAM_RANGE = 7, CAM_FOV = 0.7;
function updateCameras(dt) {
  for (const c of CAMS) {
    c.a += dt * (c.sweep == null ? 1 : c.sweep);
    c.cd -= dt;
    if (c.z !== P.z) continue;
    const d = dst(c.x, c.y, P.x, P.y);
    if (d > CAM_RANGE) continue;
    const ang = Math.atan2(P.y - c.y, P.x - c.x);
    const off = Math.abs(Math.atan2(Math.sin(ang - c.a), Math.cos(ang - c.a)));
    if (off > CAM_FOV) continue;
    if (!lineOfSight({ x: c.x, y: c.y, z: c.z }, { x: P.x, y: P.y, z: P.z })) continue;
    c.seeT += dt;
    if (c.seeT > 1.0 && c.cd <= 0) { c.cd = 5; makeNoise(c.x, c.y, c.z, 11, 'camera'); say('A camera spotted you!'); }
  }
}

const AI = {
  initAI, aiUpdate, hearNoise, startChase, startSearch, startQuietApproach,
  belAdd, belSeed, belSpots, belPeak, belStep, belCentroid, belAnchor, belClear, belTotal, belAt, lineOfSight,
  pickTask, runScript, updateChase, cutoffTarget, playerGoal,
  bestTrapSpot, planFortify, planCamera, isValidTrapCell, addTrap,
  checkTheftsNear, considerRelock, applyRelock, applyBoard, planBoardWindow, visibleSpot,
  sightRange, lineOfSight, roomNameAt, hourWeight, bestAmbushDoor, routeHeat,
  aiHitByThrow, visibleSpot,
  SCRIPTS, TASKS, NEED0,
};

/* ===== game.js ===== */
'use strict';
/* =====================================================================
   game.js — player, input, interaction, match flow, HUD
   ===================================================================== */

let ITEMS = [];     // loose objects in the world (loot / throwables)
let GAME = null;
let cv = null, ctx = null;
let CVW = 900, CVH = 620;

const KEYS = {};
const KEYMAP = { KeyW: 'up', KeyA: 'left', KeyS: 'down', KeyD: 'right', ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right' };

function newGame(seed) {
  GAME = {
    state: 'play', clock: CLOCK_START, t: 0, msg: '', msgT: 0,
    ticks: 0, alarm: 0, foot: 0, shown: {}, stats: { steps: 0, doors: 0, loot: 0 },
  };
  let w = null;
  if (seed) {
    const m = storedMatch();
    if (m && m.seed === seed) { M = m; w = makeWorld(M.seed); }
  }
  if (!w) {
    M = blankMatch(seed || ((Math.random() * 0xffffffff) >>> 0));
    w = makeWorld(M.seed);
    saveMatch();
  }
  instantiateWorld(w);
  ITEMS = (W.items || []).map((it) => ({ x: it.x, y: it.y, z: it.z, k: it.k, home: { x: it.x, y: it.y, z: it.z }, noticed: 0, taken: 0, thrown: 0 }));

  P = {
    x: W.spawn.x, y: W.spawn.y, z: 0, a: -Math.PI / 2,
    vx: 0, vy: 0, crouch: 0, sprint: 0, stam: 1, slow: 0, stun: 0,
    keys: { pick: 0, red: 0, blue: 0 },
    inv: [], carried: 0, flash: 0, flashCd: 0, hidden: 0, hideT: 0,
    stepT: 0, camo: 0, bobT: 0, lastSafe: { x: W.spawn.x, y: W.spawn.y, z: 0 },
  };
  initAI();
  belSeed();               // a starting prior: he assumes you came in the front
  HUD.tasks = buildTasks();
  HUD.note = 'Get inside without waking him.';
  GAME.msg = ''; UI.msg = ''; UI.msgT = 0; UI.over = null; UI.screen = 'play';
  return true;
}

/* ------------------------------------------------------------ new match flow */
function startMatchFromMenu(fresh) {
  if (fresh) { wipeMatch(); newGame(null); }
  else {
    const m = storedMatch();
    if (m) { M = m; newGame(m.seed); }
    else newGame(null);
  }
  UI.cut = 0;
  UI.screen = 'cut';
  GAME.state = 'cut';
}
function skipCutscene() { if (UI.screen === 'cut') { UI.screen = 'play'; GAME.state = 'play'; } }

/* ------------------------------------------------------------------ player */
const SPD_WALK = 3.05, SPD_SPRINT = 5.25, SPD_CROUCH = 1.45;

function playerUpdate(dt) {
  if (!P || GAME.state !== 'play') return;
  if (P.stun > 0) { P.stun -= dt; return; }
  P.flashCd = Math.max(0, P.flashCd - dt);
  P.slow = Math.max(0, P.slow - dt);

  let dx = 0, dy = 0;
  if (KEYS.up) dy -= 1;
  if (KEYS.down) dy += 1;
  if (KEYS.left) dx -= 1;
  if (KEYS.right) dx += 1;
  if (P.hidden) { dx = 0; dy = 0; }
  const moving = dx || dy;
  if (moving) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }

  // stamina
  if (P.sprint && moving) P.stam = Math.max(0, P.stam - dt * 0.155);
  else P.stam = Math.min(1, P.stam + dt * (P.crouch ? 0.34 : 0.2));
  if (P.stam <= 0.02) P.sprint = 0;

  const base = P.crouch ? SPD_CROUCH : P.sprint ? SPD_SPRINT : SPD_WALK;
  const spd = base * (P.slow > 0 ? 0.45 : 1) * (P.carrying ? 1 : 1);
  if (moving) {
    const sp = spd * dt;
    moveCircle(P, dx * sp, dy * sp, 0.3);
    P.bobT += sp;
    P.vx = dx * spd; P.vy = dy * spd;
    // footsteps: sprinting is loud and frequent, crouching is silent
    P.stepT += sp;
    const gap = P.sprint ? 0.75 : P.crouch ? 2.4 : 1.15;
    if (P.stepT > gap) {
      P.stepT = 0;
      const loud = P.sprint ? 7.4 : P.crouch ? 1.0 : 3.6;
      const floor = P.z;
      makeNoise(P.x, P.y, P.z, loud, 'step', { sprint: P.sprint, crouch: P.crouch });
      GAME.stats.steps++;
      if (P.sprint) addHeatNow();
    }
    P.a = Math.atan2(dy, dx);
  } else { P.vx = 0; P.vy = 0; }

  if (freeCell(P.z, P.x | 0, P.y | 0)) P.lastSafe = { x: P.x, y: P.y, z: P.z };
  if (P.crouch && roomLit(P.z, P.x, P.y) && dst(P.x, P.y, N.x, N.y) > 4) P.camo = Math.min(1, P.camo + dt * 0.5);
  else P.camo = Math.max(0, P.camo - dt * 1.4);

  // traps
  const tr = trapAt(P.z, P.x, P.y);
  if (tr && tr.armed && !P.hidden) {
    tr.armed = 0;
    P.stun = 1.1; P.slow = 2.6;
    makeNoise(P.x, P.y, P.z, 9, 'trap');
    say('SNAP! A bear trap — you are hurt and loud.');
    const i = M.traps.indexOf(P.z + ':' + (tr.x | 0) + ':' + (tr.y | 0));
    if (i >= 0) M.traps.splice(i, 1);
    saveMatch();
  }
  // fire exit: the front door is not an exit, but walking far outside is a soft fail (handled in aiUpdate)
  if (dst(P.x, P.y, W.spawn.x, W.spawn.y) < 1.2 && P.z === 0 && GAME.t > 6) P.left = 1;
}
function addHeatNow() {
  const key = P.z + ':' + (P.x | 0) + ',' + (P.y | 0);
  M.route[key] = (M.route[key] || 0) + 1;
}

/* ------------------------------------------------------------- interaction */
function interact() {
  if (GAME.state !== 'play') return;
  if (P.hidden) { P.hidden = 0; P.hideT = 0; return; }
  const fx = Math.floor(P.x + Math.cos(P.a) * 0.75), fy = Math.floor(P.y + Math.sin(P.a) * 0.75);
  const tx = fx, ty = fy;
  const z = P.z;

  // containers
  for (const c of W.containers) {
    if (c.z !== z) continue;
    const w = c.w || 1;
    const near = P.x > c.tx - 0.95 && P.x < c.tx + w + 0.95 && P.y > c.ty - 0.95 && P.y < c.ty + 1.95;
    if (!near) continue;
    openContainer(c);
    return;
  }
  // loose items
  for (const it of ITEMS) {
    if (it.z !== z || it.taken) continue;
    if (dst(P.x, P.y, it.x, it.y) < 1.05) {
      it.taken = 1;
      if (it.k === 'keyring') { P.keys.pick = 1; say('Shed keyring: LOCKPICK acquired.'); }
      else { if (P.inv.length < 3) { P.inv.push(it.k); say('Picked up the ' + it.k + '.'); } else { say('Your hands are full.'); it.taken = 0; } }
      makeNoise(P.x, P.y, z, 1.6, 'loot');
      return;
    }
  }
  // secret stash
  if (dst(P.x, P.y, W.secret.x, W.secret.y) < 1.9 && P.z === W.secret.z) {
    if (!P.keys.red || !P.keys.blue) { say('Two locks. You need the red key and the blue key.'); return; }
    winMatch();
    return;
  }
  // stairs
  const st = stairFrom(z, P.x | 0, P.y | 0);
  if (st) { climbTo(st); return; }
  // doors in front of you
  const d = doorAt(z, fx, fy);
  if (d) { useDoor(d, fx, fy); return; }
  // windows
  if (T(z, fx, fy) === 'W' || T(z, fx, fy) === 'w') { climbWindow(fx, fy); return; }
  // search the cell you face
  if (T(z, tx, ty) === 'S') { say('Furniture. Nothing hidden here.'); return; }
  say('Nothing to do here.');
}

function openContainer(c) {
  if (c.done) { say('The ' + c.label + ' is empty.'); return; }
  c.done = 1;
  makeNoise(P.x, P.y, P.z, 4.6, 'loot');
  GAME.stats.loot++;
  if (c.gives === 'red') { P.keys.red = 1; say('RED KEY found in the ' + c.label + '!'); aiSoundKey(c); }
  else if (c.gives === 'blue') { P.keys.blue = 1; say('BLUE KEY found in the ' + c.label + '!'); aiSoundKey(c); }
  else if (c.gives === 'pick') { P.keys.pick = 1; say('LOCKPICK found in the ' + c.label + '!'); aiSoundKey(c); }
  else { if (P.inv.length < 3) P.inv.push('trinket'); say('The ' + c.label + ' holds a trinket.'); }
  M.suspicion = Math.min(100, M.suspicion + 1.4);
  saveMatch();
}
function aiSoundKey(c) { aiSay('Did I just hear my ' + c.label + '?'); }

function useDoor(d, x, y) {
  if (d.kind === 'cellar') {
    if (!d.closed) { say('The vault. Whatever he keeps in there is the point of all this.'); return; }
    if (!P.keys.red) { say('Locked. A red keyhole.'); makeNoise(P.x, P.y, P.z, 3, 'door'); return; }
    d.closed = 0; d.playerUnlocked = 1; d.lockChar = 'B';
    for (const [dx2, dy2] of d.cells) W.floors[d.z].G[dy2][dx2] = 'D';
    (M.needRelock = M.needRelock || []).push(d.z + ':' + d.cells[0][0] + ':' + d.cells[0][1]);
    saveMatch();
    say('The RED KEY turns: the vault door is open.');
    makeNoise(P.x, P.y, P.z, 6, 'door');
    aiSay('The vault?! No — not the vault!');
    M.suspicion = Math.min(100, M.suspicion + 12);
    return;
  }
  if (d.kind === 'lock') {
    if (!d.closed) { say('The study door. The desk is inside.'); return; }
    if (!P.keys.pick) { say('Locked tight. A lockpick would do it.'); makeNoise(P.x, P.y, P.z, 3.5, 'door'); return; }
    d.closed = 0; d.playerUnlocked = 1; d.lockChar = 'L';
    for (const [dx2, dy2] of d.cells) W.floors[d.z].G[dy2][dx2] = 'D';
    W.studyOpen = 1;
    (M.needRelock = M.needRelock || []).push(d.z + ':' + d.cells[0][0] + ':' + d.cells[0][1]);
    saveMatch();
    say('Picked the lock. The study is open.');
    makeNoise(P.x, P.y, P.z, 3.2, 'lockpick');
    aiSay('Who is picking my lock?');
    M.suspicion = Math.min(100, M.suspicion + 9);
    return;
  }
  if (d.closed) openDoor(P.z, x, y, { crouch: P.crouch }), (GAME.stats.doors++, say('Door opened.'));
  else { closeDoor(P.z, x, y); say('Door closed.'); }
  if (d.closed && d.playerUnlocked) d.playerUnlocked = 0;
}

function climbWindow(wx, wy) {
  // find a free cell straight behind the window relative to the player
  const dx = wx - (P.x | 0), dy = wy - (P.y | 0);
  const bx = wx + Math.sign(dx), by = wy + Math.sign(dy);
  if (!freeCell(P.z, bx, by)) { say('Can not climb through from here.'); return; }
  P.x = bx + 0.5; P.y = by + 0.5;
  makeNoise(P.x, P.y, P.z, 5.2, 'window');
  M.entries[P.z + ':' + wx + ':' + wy] = (M.entries[P.z + ':' + wx + ':' + wy] || 0) + 1;
  say('You climbed through the window.');
  saveMatch();
}

function climbTo(s) {
  P.z = s.z; P.x = s.x + 0.5; P.y = s.y + 0.5;
  makeNoise(P.x, P.y, P.z, 4.4, 'stairs');
  const r = roomAt(P.z, P.x, P.y);
  say('You are ' + (P.z === 0 ? 'downstairs' : 'upstairs') + '.');
  GAME.shown['z' + P.z] = 1;
}

/* --------------------------------------------------------------- carrying */
function pickUpDrop() {
  const it = nearestLooseItem();
  if (it) {
    if (P.carried) { say('Already carrying the ' + P.carried + '.'); return; }
    P.carried = it.k; it.taken = 1;
    say('You are carrying the ' + it.k + '. Click or press Q to throw it.');
    makeNoise(P.x, P.y, P.z, 2.4, 'loot');
    return;
  }
  if (P.carried) {
    const k = P.carried; P.carried = 0;
    const q = nearestStandable(P.z, P.x + Math.cos(P.a), P.y + Math.sin(P.a), 0.2);
    if (q) ITEMS.push({ x: q[0] + 0.5, y: q[1] + 0.5, z: P.z, k, taken: 0, home: null, noticed: 1 });
    say('You set the ' + k + ' down.');
  } else say('Nothing to carry.');
}
function nearestLooseItem() {
  let best = null, bd = 1.3;
  for (const it of ITEMS) {
    if (it.taken || it.z !== P.z) continue;
    const d = dst(P.x, P.y, it.x, it.y);
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}

function throwCarried(ax, ay) {
  if (GAME.state !== 'play') return;
  if (!P.carried) { say('Nothing to throw. Throw a vase, a tomato, a box…'); return; }
  const kind = P.carried; P.carried = 0;
  const d = Math.max(0.4, dst(P.x, P.y, ax, ay));
  const speed = Math.min(11, 5 + d * 0.7);
  const t = d / speed;
  const vx = (ax - P.x) / t, vy = (ay - P.y) / t;
  spawnProjectile(kind, P.x, P.y, P.z, vx, vy, 2.6 + d * 0.16, 'p');
  makeNoise(P.x, P.y, P.z, 2.2, 'throw');
  say('You threw the ' + kind + '.');
}

function toggleFlash() {
  if (P.flashCd > 0) { say('The torch is recharging.'); return; }
  P.flash = !P.flash;
  P.flashCd = 0.35;
  say(P.flash ? 'Torch on — he can see you from further away.' : 'Torch off.');
  if (P.flash) makeNoise(P.x, P.y, P.z, 2.5, 'click');
}

/* ------------------------------------------------------------ flashlight */
function flashCone() { return P.flash && GAME.state === 'play'; }

/* ---------------------------------------------------------------- hiding */
function tryHide() {
  // must be standing next to furniture in a dark corner
  if (!roomAt(P.z, P.x, P.y)) { say('Nothing to hide behind out here.'); return; }
  const dark = !litAt(P.z, P.x, P.y);
  if (!dark && N.dist < 6) { say('Too bright to hide here.'); return; }
  P.hidden = 1; P.hideT = 0;
  say('Hiding. Hold still — moving gives you away.');
  M.hides.push({ x: P.x, y: P.y, z: P.z });
  if (M.hides.length > 12) M.hides.shift();
  saveMatch();
}

/* ---------------------------------------------------------------- win */
function winMatch() {
  GAME.state = 'over';
  UI.over = 'win';
  M.wins++;
  M.suspicion = Math.max(0, M.suspicion - 25);
  saveMatch();
  UI.screen = 'over';
}

/* --------------------------------------------------------------- objectives */
const HUD = { tasks: [], note: '' };
function buildTasks() {
  const t = [];
  t.push({ k: 'shed', txt: 'Get the lockpick from the shed', done: P.keys.pick });
  t.push({ k: 'inside', txt: 'Get inside the house', done: P.z > 0 || insideHouse() });
  t.push({ k: 'study', txt: 'Pick the study door lock', done: W.studyUnlocked || P.keys.blue });
  t.push({ k: 'blue', txt: 'Find the blue key (study desk)', done: P.keys.blue });
  t.push({ k: 'red', txt: 'Find the red key (kitchen fridge)', done: P.keys.red });
  t.push({ k: 'cellar', txt: 'Unlock the vault (red key)', done: !!W.cellarOpen });
  t.push({ k: 'secret', txt: 'Take the SECRET from the vault', done: M.wins > 0 });
  return t;
}
function insideHouse() {
  return P.x > HOUSE.x && P.x < HOUSE.x + HOUSE.w && P.y > HOUSE.y && P.y < HOUSE.y + HOUSE.h;
}
function refreshTasks() {
  if (!HUD.tasks.length || !P) return;
  for (const t of HUD.tasks) {
    if (t.k === 'inside') t.done = P.z > 0 || insideHouse();
    if (t.k === 'study') t.done = !!W.studyOpen;
    if (t.k === 'cellar') t.done = !!W.cellarOpen || (W.cellarDoor && !W.cellarDoor.closed);
    if (t.k === 'secret') t.done = M.wins > 0;
  }
}

/* ---------------------------------------------------------------- input */
function bindInput() {
  addEventListener('keydown', (e) => {
    if (UI.screen === 'help') { UI.screen = 'menu'; if (e.preventDefault) e.preventDefault(); return; }
    if (UI.screen === 'menu' && MENU) { menuKey(e.code); if (e.preventDefault) e.preventDefault(); return; }
    if (e.code === 'Escape') {
      if (UI.screen === 'play') { UI.screen = 'pause'; GAME.state = 'pause'; }
      else if (UI.screen === 'pause') { UI.screen = 'play'; GAME.state = 'play'; }
      if (e.preventDefault) e.preventDefault();
      return;
    }
    if (UI.screen === 'cut' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE')) { skipCutscene(); return; }
    if (UI.screen === 'over' && (e.code === 'Enter' || e.code === 'KeyR')) { UI.screen = 'play'; startMatchFromMenu(false); return; }
    if (UI.screen === 'pause' && (e.code === 'KeyR')) { UI.screen = 'play'; startMatchFromMenu(false); return; }
    if (UI.screen !== 'play') return;
    const m = KEYMAP[e.code];
    if (m) { KEYS[m] = 1; e.preventDefault(); return; }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { P.sprint = 1; return; }
    if (e.code === 'KeyC') { P.crouch = !P.crouch; P.sprint = 0; return; }
    if (e.code === 'KeyE') { interact(); return; }
    if (e.code === 'KeyQ') { throwCarried(P.x + Math.cos(P.a) * 3, P.y + Math.sin(P.a) * 3); return; }
    if (e.code === 'KeyF') { throwCarried(mouseWorld.x, mouseWorld.y); return; }
    if (e.code === 'KeyG') { pickUpDrop(); return; }
    if (e.code === 'KeyH') { tryHide(); return; }
    if (e.code === 'KeyT') { toggleFlash(); return; }
    if (e.code === 'KeyM') { UI.showBelief = !UI.showBelief; return; }
    if (e.code === 'KeyP') { UI.screen = 'pause'; GAME.state = 'pause'; return; }
  });
  addEventListener('keyup', (e) => {
    const m = KEYMAP[e.code];
    if (m) { KEYS[m] = 0; return; }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') P.sprint = 0;
  });
  addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = 0; if (P) P.sprint = 0; });
}

function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (CVW / r.width), y: (ev.clientY - r.top) * (CVH / r.height) };
}
const mouseScreen = { x: CVW / 2, y: CVH / 2 };
let mouseWorld = { x: 0, y: 0 };

function bindMouse() {
  cv.addEventListener('mousemove', (e) => { const p = canvasPos(e); mouseScreen.x = p.x; mouseScreen.y = p.y; });
  cv.addEventListener('mousedown', (e) => {
    if (UI.screen === 'help') { UI.screen = 'menu'; return; }
    if (UI.screen === 'menu') {
      const p0 = canvasPos(e);
      if (!menuClick(p0.x, p0.y)) { /* ignore stray clicks */ }
      return;
    }
    if (UI.screen === 'cut') { skipCutscene(); return; }
    if (UI.screen === 'over') { UI.screen = 'play'; startMatchFromMenu(false); return; }
    if (UI.screen === 'pause') { UI.screen = 'play'; GAME.state = 'play'; return; }
    if (UI.screen !== 'play') return;
    const p = canvasPos(e);
    const w = screenToWorld(p.x, p.y);
    if (e.button === 0) throwCarried(w.x, w.y);
    if (e.button === 2) toggleFlash();
  });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => { ZOOM = clamp(ZOOM * (e.deltaY > 0 ? 0.92 : 1.08), 1.3, 3.2); e.preventDefault(); }, { passive: false });
}

let ZOOM = 2.0;
let CAMX = 0, CAMY = 0;
function screenToWorld(sx, sy) {
  const scale = TS * ZOOM;
  return { x: (sx - CVW / 2) / scale + CAMX, y: (sy - CVH / 2) / scale + CAMY };
}

/* --------------------------------------------------------------- game step */
function gameUpdate(dt) {
  if (!GAME) return;
  if (GAME.state !== 'play') return;
  GAME.ticks++;
  playerUpdate(dt);
  if (GAME.state !== 'play') return;
  aiUpdate(dt);
  updateProjectiles(dt);
  for (const c of W.containers) if (c.done && !c.seen && c.t === undefined) c.t = 0;
  refreshTasks();
  if (GAME.msgT > 0) GAME.msgT -= dt;
  if (UI.msgT > 0) UI.msgT -= dt;
  for (const k in GAME.shown) {}
  // clock
  GAME.clock += dt / HOUR_SECONDS;
  if (GAME.clock >= 24) GAME.clock -= 24;
  // save lightly
  GAME.saveT = (GAME.saveT || 0) + dt;
  if (GAME.saveT > 6) {
    GAME.saveT = 0;
    M.clock = GAME.clock;
    for (const F of W.floors) for (const r of F.rooms) {}
    saveMatch();
  }
}

/* ---------------------------------------------------------------- ticker */
let LAST_TS = 0, ACC = 0;
const STEP = 1 / 60;
function frame(ts) {
  if (!LAST_TS) LAST_TS = ts;
  let dt = (ts - LAST_TS) / 1000;
  LAST_TS = ts;
  if (dt > 0.25) dt = 0.25;
  ACC += dt;
  let guard = 0;
  while (ACC >= STEP && guard++ < 8) { gameUpdate(STEP); ACC -= STEP; }
  if (UI.screen === 'cut') { UI.cut += dt; if (UI.cut > 13) skipCutscene(); }
  updateCamera(dt);
  render(dt);
  requestAnimationFrame(frame);
}

function updateCamera(dt) {
  if (!P) return;
  const k = 1 - Math.pow(0.0015, dt);
  CAMX = lerp(CAMX, P.x, k);
  CAMY = lerp(CAMY, P.y, k);
  const scale = TS * ZOOM;
  const halfW = CVW / 2 / scale, halfH = CVH / 2 / scale;
  CAMX = clamp(CAMX, halfW, MW - halfW);
  CAMY = clamp(CAMY, halfH, MH - halfH);
  mouseWorld = screenToWorld(mouseScreen.x, mouseScreen.y);
}

/* ---------------------------------------------------------------- boot */
function boot() {
  cv = document.getElementById('game');
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  bindInput();
  bindMouse();
  // menu preview world (no match memory yet)
  M = blankMatch(1234);
  W = makeWorld(M.seed);
  instantiateWorld(W);
  P = null; N = null;
  UI.screen = 'menu';
  requestAnimationFrame(frame);
}

const GAMEAPI = {
  get P() { return P; }, get N() { return N; }, get M() { return M; }, get W() { return W; }, get GAME() { return GAME; },
  tileAt: (z, x, y) => T(z, x, y),
  newGame, startMatchFromMenu, skipCutscene, interact, gameUpdate, render,
  get MEM() { return M; }, get ITEMS() { return ITEMS; }, get CAMS() { return CAMS; }, get TRAPS() { return TRAPS; },
  throwCarried, pickUpDrop, toggleFlash, tryHide, winMatch, saveMatch, wipeMatch, storedMatch,
  bestTrapSpot, planFortify, planCamera, isValidTrapCell, addTrap, makeNoise,
  belSeed, belSpots, belPeak, belAdd, belStep, belCentroid, belTotal, belClear,
  cutoffTarget, playerGoal, pickupAt: nearestLooseItem,
  get SHOW() { return UI; }, get STAIR() { return STAIR; }, get DOORS() { return DOORS; },
  setClock(h) { if (GAME) GAME.clock = h; }, hourSet(h) { if (GAME) GAME.clock = h; },
  aiUpdate, startChase, startSearch, pickTask, refreshTasks,
  freezeAI(on) { if (GAME) GAME.freezeAI = !!on; },
  sightRange, lineOfSight, isNight, roomLit, litAt, hasKey: (k) => !!(P && P.keys[k]),
  bestAmbushDoor, belSpots: (z, n) => belSpots(z, n),
  addCamera, tick(idt) { gameUpdate(idt || 1 / 60); },
  get LAST() { return { seed: W && W.seed, kinds: [...new Set((W.doors || []).map((d) => d.kind))] }; },
  get HUD() { return HUD; }, get MOUSE() { return mouseWorld; },
};

/* ===== views.js ===== */
'use strict';
/* =====================================================================
   views.js — the plain look: flat tiles, coloured boxes for furniture,
   circles for people. No shading, no rugs, no light pools. Canvas draws
   the world; four plain DOM panels hold the text HUD.
   ===================================================================== */

const $ = (id) => document.getElementById(id);

const COL = {
  grassA: '#86c96e', grassB: '#7fc268', roof: '#332f2a',
  edge: '#1b1e22', wall: '#3b3f46', fence: '#ffffff', path: '#d9d4c2',
  win: '#9fd4ef', winBroken: '#d8f1ff', boarded: '#8a6246',
  door: '#a0632c', locked: '#cc3b32', cellar: '#7a3db0',
  up: '#c9a227', down: '#6f8fbf', stair: '#c9a227',
  player: '#f7f7f7', aim: '#2d6fdc', npc: '#e8803a', chase: '#e8453a',
  clue: '#ffd23f', bg: '#16202b', fencePost: '#d9d4c2',
};
const FC = {
  couch: '#4f7fd1', tv: '#222222', table: '#b07a45', shelf: '#7a5230', sink: '#9aabb4',
  stove: '#888888', counter: '#d8d0c0', fridge: '#f2f2f2', coat: '#6a4a3a', mirror: '#9ccfff',
  bed: '#e9e4f0', wardrobe: '#7a5230', night: '#aa5577', nightstand: '#aa5577',
  dresser: '#7a5230', desk: '#9b6a3a', toilet: '#ffffff', tub: '#ddffff', basin: '#cfe6f2',
  bench: '#a07a3a', rack: '#554433', toolbox: '#cc3333', crate: '#c8964f',
  bookshelf: '#7a5230', cabinet: '#7a5230', tree: '#3f9a4a', mailbox: '#3366cc', trash: '#556677',
  stairs: '#c9a227',
};
const IC = { tomato: '#e63b2e', can: '#cc3333', vase: '#3a86d9', chair: '#b5651d', box: '#c8964f', lamp: '#ffe27a' };

/* ------------------------------------------------------------ the frame */
function render(dt) {
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, CVW, CVH);
  if (UI.screen === 'menu' || UI.screen === 'help' || UI.screen === 'cut' || !GAME || !W || !P) {
    showPanels(false);
    if (UI.screen === 'menu') { drawMenu(dt); return; }
    if (UI.screen === 'help') { drawHelp(); return; }
    if (UI.screen === 'cut') { drawCut(dt); return; }
    return;
  }
  showPanels(true);
  drawWorld();
  drawHUD();
  if (UI.screen === 'pause') drawPause();
  if (UI.screen === 'over') drawOver();
}

function roomAt(z, x, y) {
  const F = W.floors[z];
  for (const r of F.rooms) {
    if (x >= r.x + 1 && x <= r.x + r.iw && y >= r.y + 1 && y <= r.y + r.ih) return r;
  }
  return null;
}

function drawWorld() {
  const scale = TS * ZOOM;
  const ox = CVW / 2 - CAMX * scale, oy = CVH / 2 - CAMY * scale;
  const x0 = Math.max(0, Math.floor(CAMX - CVW / 2 / scale) - 1), x1 = Math.min(MW - 1, Math.ceil(CAMX + CVW / 2 / scale) + 1);
  const y0 = Math.max(0, Math.floor(CAMY - CVH / 2 / scale) - 1), y1 = Math.min(MH - 1, Math.ceil(CAMY + CVH / 2 / scale) + 1);
  const F = W.floors[P.z];
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.lineWidth = 0.06;
  ctx.lineJoin = 'round';

  // ---- flat ground / room floors
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const ch = F.G[y][x];
    const wallish = ch === '#' || ch === 'D' || ch === 'W' || ch === 'w' || ch === 'X' || ch === 'L' || ch === 'B' || ch === 'U' || ch === 'N';
    let col;
    const r = roomAt(P.z, x, y);
    if (wallish) col = COL.wall;
    else if (r) col = r.col;
    else if (P.z === 0) col = (x + y) % 2 ? COL.grassA : COL.grassB;
    else col = COL.roof;
    if (ch === 'P') col = COL.path;
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 1.02, 1.02);
    if (r && !wallish) { ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.strokeRect(x, y, 1, 1); ctx.strokeStyle = COL.edge; }
  }

  // ---- walls, doors, windows, fences, stairs
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const ch = F.G[y][x];
    let col = null, inset = 0;
    if (ch === '#') col = COL.wall;
    else if (ch === 'F') col = COL.fence;
    else if (ch === 'S') continue; // furniture, drawn below
    else if (ch === 'W') col = COL.win;
    else if (ch === 'w') col = COL.winBroken;
    else if (ch === 'X') col = COL.boarded;
    else if (ch === 'L') col = COL.locked;
    else if (ch === 'B') col = COL.cellar;
    else if (ch === 'D') { col = COL.door; inset = 0.15; }
    else if (ch === 'U') col = COL.up;
    else if (ch === 'N') col = COL.down;
    if (!col) continue;
    if (ch === 'F') {
      if (P.z > 0) continue;   // upstairs, outside the rooms is just roof
      // a picket fence: one plain white post per tile (the old look)
      ctx.fillStyle = COL.fence;
      ctx.fillRect(x + 0.34, y + 0.28, 0.32, 0.44);
      continue;
    }
    if (ch === 'D') {
      const dd = doorAt(P.z, x, y);
      if (dd && !dd.closed) ctx.globalAlpha = 0.3;
    }
    ctx.strokeStyle = COL.edge;
    ctx.fillStyle = col;
    ctx.fillRect(x + inset, y + inset, 1 - 2 * inset, 1 - 2 * inset);
    if (ch !== '#') ctx.strokeRect(x + inset, y + inset, 1 - 2 * inset, 1 - 2 * inset);
    ctx.globalAlpha = 1;
    if (ch === 'w') {
      ctx.strokeStyle = '#778899';
      ctx.beginPath(); ctx.moveTo(x + 0.1, y + 0.9); ctx.lineTo(x + 0.5, y + 0.3); ctx.lineTo(x + 0.9, y + 0.9); ctx.stroke();
      ctx.strokeStyle = COL.edge;
    }
    if (ch === 'U' || ch === 'N') {
      ctx.fillStyle = COL.edge;
      ctx.beginPath();
      if (ch === 'U') { ctx.moveTo(x + 0.25, y + 0.72); ctx.lineTo(x + 0.5, y + 0.28); ctx.lineTo(x + 0.75, y + 0.72); }
      else { ctx.moveTo(x + 0.25, y + 0.28); ctx.lineTo(x + 0.5, y + 0.72); ctx.lineTo(x + 0.75, y + 0.28); }
      ctx.closePath(); ctx.fill();
    }
  }

  // ---- furniture: a flat coloured box with an outline
  for (const f of F.furniture) {
    ctx.fillStyle = FC[f.k] || '#999999';
    ctx.fillRect(f.x + 0.06, f.y + 0.06, f.w - 0.12, f.h - 0.12);
    ctx.strokeRect(f.x + 0.06, f.y + 0.06, f.w - 0.12, f.h - 0.12);
  }
  if (P.z === 0) for (const d of W.decor) {
    const [dz, x, y, dw, dh, k] = d;
    if (dz !== 0) continue;
    ctx.fillStyle = FC[k] || '#999999';
    if (k === 'tree') { ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 1.05, 0, 7); ctx.fill(); ctx.stroke(); }
    else { ctx.fillRect(x + 0.1, y + 0.1, dw - 0.2, dh - 0.2); ctx.strokeRect(x + 0.1, y + 0.1, dw - 0.2, dh - 0.2); }
  }

  // ---- splats, traps, cameras, loose items
  for (const s of SPL) {
    if (s.z !== P.z) continue;
    ctx.fillStyle = s.k === 'splat' ? 'rgba(230,59,46,0.7)' : 'rgba(126,200,255,0.7)';
    ctx.beginPath(); ctx.arc(s.x, s.y, 0.35, 0, 7); ctx.fill();
  }
  for (const t of TRAPS) {
    if (t.z !== P.z) continue;
    ctx.strokeStyle = t.armed ? '#cc3b32' : '#888888';
    ctx.lineWidth = 0.09;
    ctx.beginPath();
    ctx.arc(t.x + 0.5, t.y + 0.5, 0.3, 0, 7);
    ctx.moveTo(t.x + 0.3, t.y + 0.3); ctx.lineTo(t.x + 0.7, t.y + 0.7);
    ctx.moveTo(t.x + 0.7, t.y + 0.3); ctx.lineTo(t.x + 0.3, t.y + 0.7);
    ctx.stroke();
    ctx.lineWidth = 0.06;
  }
  for (const c of CAMS) {
    if (c.z !== P.z) continue;
    ctx.fillStyle = '#222222';
    ctx.fillRect(c.x + 0.3, c.y + 0.3, 0.4, 0.4);
    ctx.beginPath();
    ctx.moveTo(c.x + 0.5, c.y + 0.5);
    for (let i = 0; i <= 14; i++) {
      const a = c.a - (CAM_FOV || 0.6) + 2 * (CAM_FOV || 0.6) * i / 14;
      let ex = c.x + 0.5, ey = c.y + 0.5;
      for (let r = 0.3; r < (CAM_RANGE || 9); r += 0.25) {
        const px = c.x + 0.5 + Math.cos(a) * r, py = c.y + 0.5 + Math.sin(a) * r;
        if (opaque(P.z, px, py)) break;
        ex = px; ey = py;
      }
      ctx.lineTo(ex, ey);
    }
    ctx.closePath();
    ctx.fillStyle = c.seeT > 0.2 ? 'rgba(232,69,58,0.25)' : 'rgba(232,69,58,0.08)';
    ctx.fill();
    ctx.strokeStyle = COL.edge;
    ctx.stroke();
  }
  for (const k of W.containers) {
    if (k.z !== P.z || k.done) continue;
    ctx.fillStyle = COL.clue;
    for (let i = 0; i < (k.w || 1); i++) {
      ctx.fillRect(k.tx + i + 0.36, k.ty + 0.36, 0.28, 0.28);
      ctx.strokeRect(k.tx + i + 0.36, k.ty + 0.36, 0.28, 0.28);
    }
  }
  if (W.secret.z === P.z) {
    ctx.fillStyle = COL.clue;
    ctx.beginPath(); ctx.arc(W.secret.x, W.secret.y, 0.3 + Math.sin(GAME.t * 4) * 0.05, 0, 7); ctx.fill(); ctx.stroke();
  }
  for (const it of ITEMS) {
    if (it.z !== P.z || it.taken || it.fly) continue;
    ctx.fillStyle = IC[it.k] || '#999999';
    ctx.beginPath();
    if (it.k === 'chair' || it.k === 'box') ctx.rect(it.x - 0.2, it.y - 0.2, 0.4, 0.4);
    else ctx.arc(it.x, it.y, 0.2, 0, 7);
    ctx.fill(); ctx.stroke();
  }
  for (const p of PR) {
    if (p.dead || Math.abs(p.z) > 0.05) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.27)';
    ctx.beginPath(); ctx.arc(p.x, p.y, 0.14, 0, 7); ctx.fill();
    ctx.fillStyle = IC[p.k] || '#999999';
    ctx.beginPath(); ctx.arc(p.x, p.y - p.z * 0.25, 0.17, 0, 7); ctx.fill(); ctx.stroke();
  }

  // ---- his belief about where you are (debug overlay, M)
  if (UI.showBelief) {
    const B = BEL[P.z];
    if (B) {
      let peak = 0.000001;
      for (let i = 0; i < B.length; i++) if (B[i] > peak) peak = B[i];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const v = B[y * MW + x];
        if (v <= peak * 0.004) continue;
        ctx.fillStyle = 'rgba(255,0,60,' + Math.min(0.6, Math.sqrt(v / peak) * 0.6) + ')';
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  // ---- noise rings
  for (const n of NZ) {
    if (n.z !== P.z) continue;
    const a = n.t / 0.9;
    if (a < 0 || a > 1) continue;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * (1 - a)) + ')';
    ctx.lineWidth = 0.08;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r * a, 0, 7); ctx.stroke();
    ctx.lineWidth = 0.06;
  }

  // ---- his view cone, cut by walls (only what he really sees)
  if (N && N.z === P.z) {
    const cone = viewCone(N.x, N.y, N.a, sightRange(), N.z);
    if (cone.length) {
      ctx.beginPath();
      ctx.moveTo(N.x, N.y);
      for (const q of cone) ctx.lineTo(q[0], q[1]);
      ctx.closePath();
      ctx.fillStyle = N.mode === 'chase' ? 'rgba(232,69,58,.2)'
        : N.al > 0.15 ? 'rgba(224,194,58,.24)'
          : N.sleeping ? 'rgba(120,120,255,.12)' : 'rgba(255,240,150,.16)';
      ctx.fill();
    }
    if (UI.showPath && N.path && N.path.length) {
      ctx.strokeStyle = '#2d6fdc'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(N.x, N.y);
      for (const q of N.path) ctx.lineTo(q.x + 0.5, q.y + 0.5);
      ctx.stroke();
      ctx.lineWidth = 0.06;
    }
  }

  // ---- the neighbour
  if (N) {
    if (N.z === P.z) {
      ctx.strokeStyle = COL.edge; ctx.lineWidth = 0.1;
      ctx.fillStyle = N.mode === 'chase' ? COL.chase : COL.npc;
      ctx.beginPath(); ctx.arc(N.x, N.y, 0.46, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a1a10';
      ctx.beginPath(); ctx.arc(N.x + Math.cos(N.a) * 0.28, N.y + Math.sin(N.a) * 0.28, 0.13, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 0.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 0.08; ctx.strokeStyle = '#000000';
      const lb = String(N.label || N.st || 'idle').replace(/_/g, ' ');
      ctx.strokeText(lb, N.x, N.y - 0.8);
      ctx.fillText(lb, N.x, N.y - 0.8);
      if (N.sleeping) { ctx.font = 'bold 1px sans-serif'; ctx.fillText('Zzz', N.x + 0.5, N.y - 1.4); }
      if (N.al > 0.15 || N.mode === 'chase') {
        ctx.font = 'bold 1.2px sans-serif';
        ctx.fillStyle = N.mode === 'chase' ? '#ff3333' : '#ffcc00';
        ctx.fillText(N.mode === 'chase' ? '!' : '?', N.x, N.y - 1.5);
      }
      ctx.lineWidth = 0.06; ctx.strokeStyle = COL.edge; ctx.textAlign = 'left';
    } else {
      // he is on the other floor: show him at the stairs
      const st = stairSpot(N.z);
      if (st) {
        ctx.fillStyle = 'rgba(232,69,58,.5)';
        ctx.beginPath(); ctx.arc(st.x + 0.5, st.y + 0.5, 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 0.55px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(N.z > P.z ? 'ABOVE' : 'BELOW', st.x + 0.5, st.y - 0.2);
        ctx.textAlign = 'left';
      }
    }
  }

  // ---- the player
  if (P.aim === undefined) P.aim = P.a;
  if (P.carried) {
    ctx.setLineDash([0.15, 0.2]);
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.moveTo(P.x, P.y);
    ctx.lineTo(P.x + Math.cos(P.a) * 9, P.y + Math.sin(P.a) * 9);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const pr = P.crouch ? 0.27 : 0.36;
  ctx.strokeStyle = COL.edge; ctx.lineWidth = 0.1;
  ctx.fillStyle = COL.player;
  ctx.beginPath(); ctx.arc(P.x, P.y, pr, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = COL.aim;
  ctx.beginPath(); ctx.arc(P.x + Math.cos(P.a) * pr * 0.55, P.y + Math.sin(P.a) * pr * 0.55, pr * 0.38, 0, 7); ctx.fill();
  if (P.carried) {
    ctx.fillStyle = IC[P.carried] || '#999999';
    ctx.beginPath(); ctx.arc(P.x - Math.cos(P.a) * 0.3, P.y - Math.sin(P.a) * 0.3, 0.14, 0, 7); ctx.fill();
  }
  if (P.hold > 0 && P.tgt) {
    ctx.strokeStyle = COL.clue; ctx.lineWidth = 0.12;
    ctx.beginPath();
    ctx.arc(P.x, P.y, 0.6, -Math.PI / 2, -Math.PI / 2 + Math.min(1, P.hold / P.tgt.t) * 2 * Math.PI);
    ctx.stroke();
    ctx.lineWidth = 0.06;
  }
  ctx.restore();

  // ---- night: one flat blue wash, no pools
  const night = nightAmount();
  if (night > 0.02) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(9,18,52,' + (night * 0.4) + ')';
    ctx.fillRect(0, 0, CVW, CVH);
    if (P.flash) {
      const g = ctx.createRadialGradient(CVW / 2, CVH / 2, 10, CVW / 2, CVH / 2, 240);
      g.addColorStop(0, 'rgba(255,244,200,0.18)');
      g.addColorStop(1, 'rgba(255,244,200,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CVW, CVH);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // ---- a soft vignette, then the danger edge
  const vg = ctx.createRadialGradient(CVW / 2, CVH / 2, Math.min(CVW, CVH) * 0.42, CVW / 2, CVH / 2, Math.max(CVW, CVH) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(6,12,20,.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CVW, CVH);
  if (N && N.mode === 'chase' && N.z === P.z) {
    ctx.strokeStyle = 'rgba(232,69,58,' + (0.22 + Math.sin(performance.now() / 300) * 0.12) + ')';
    ctx.lineWidth = 7;
    ctx.strokeRect(0, 0, CVW, CVH);
  }
}

function nightAmount() {
  if (!GAME) return 0;
  const h = ((GAME.clock % 24) + 24) % 24;
  if (h >= 21 || h < 5) return 1;
  if (h >= 18) return (h - 18) / 3;
  if (h < 7) return 1 - (h - 5) / 2;
  return 0;
}

/* a sight cone that stops at walls — his real field of view */
function viewCone(x, y, a, range, z) {
  const out = [];
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const ang = a - 0.95 + (2 * 0.95 * i) / N;
    let px = x, py = y;
    for (let r = 0.35; r < range; r += 0.22) {
      const nx = x + Math.cos(ang) * r, ny = y + Math.sin(ang) * r;
      if (opaque(z == null ? P.z : z, nx, ny)) break;
      px = nx; py = ny;
    }
    out.push([px, py]);
  }
  return out;
}

function stairSpot(z) {
  if (!W || !W.stairs) return null;
  for (const s of W.stairs) {
    if (s.a.z === z) return s.a;
    if (s.b.z === z) return s.b;
  }
  return null;
}

function opaque(z, x, y) {
  const c = T(z, x | 0, y | 0);
  if (c === '#' || c === 'S' || c === 'W' || c === 'X' || c === 'T') return true;
  if (c === 'D' || c === 'L' || c === 'B') return doorClosed(z, x | 0, y | 0);
  return false;
}

/* -------------------------------------------------------------- the HUD */
let panelsOn = null;
function showPanels(on) {
  if (panelsOn === on) return;
  panelsOn = on;
  for (const id of ['hud', 'dbg', 'inv']) {
    const el = $(id);
    if (el) el.style.display = on ? 'block' : 'none';
  }
  if (!on) { const m = $('msg'); if (m) m.style.display = 'none'; }
}

let hudCache = '';
function drawHUD() {
  const hud = $('hud'), dbg = $('dbg'), inv = $('inv'), msg = $('msg');
  if (!hud) return;
  const hh = Math.floor(GAME.clock), mm = Math.floor((GAME.clock % 1) * 60);
  const tick = (b) => (b ? '✔' : '·');
  const objs = [
    tick(P.keys.pick) + ' lockpick (shed)',
    tick(P.keys.red) + ' red key (kitchen fridge)',
    tick(P.keys.blue) + ' blue key (study desk)',
    tick(!!W.cellarOpen || (W.cellarDoor && !W.cellarDoor.closed)) + ' vault (workshop, red key)',
    tick(M.wins > 0) + ' take the SECRET',
  ];
  const pr = promptText();
  const L = '<b>Objective</b>\n' + objs.join('\n') +
    (P.z === 1 ? '\n<span class="dim">upstairs</span>' : '') +
    (pr ? '\n<b style="color:#ffd23f">' + pr + '</b>' : '');
  if (L !== hudCache) { hudCache = L; hud.innerHTML = L; }

  const slots = [
    '<span class="slot' + (P.keys.pick ? ' sel' : '') + '">🗝 pick</span>',
    '<span class="slot' + (P.keys.red ? ' sel' : '') + '">red</span>',
    '<span class="slot' + (P.keys.blue ? ' sel' : '') + '">blue</span>',
    '<span class="slot">' + (P.carried || '—') + '</span>',
  ];
  const IH = slots.join('');
  if (inv._last !== IH) { inv._last = IH; inv.innerHTML = IH; }

  const bar = (v, col) => '<span class="bar" style="width:' + Math.round(clamp(v, 0, 1) * 60) + 'px;background:' + col + '"></span>';
  const D = '<b>THE NEIGHBOUR</b> ' + pad(hh) + ':' + pad(mm) +
    '\nstate: <b>' + (N.mode || '?') + '</b> ' + String(N.st || '').replace(/_/g, ' ') +
    '\ndoing: ' + (N.label || '—') +
    '\nawareness ' + bar(N.mode === 'chase' ? 1 : N.al, '#f33') +
    '\nsuspicion ' + bar((M.suspicion || 0) / 100, '#f80') +
    '\nbelief ' + Math.round((BEL[P.z] ? belTotal(P.z) : 0) * 100) + '% · floor ' + (P.z + 1) + '/2' +
    '\ncatches ' + M.catches + ' · wins ' + M.wins +
    '\ntraps ' + TRAPS.length + ' · cameras ' + CAMS.length +
    '\n' + (UI.showBelief ? 'M belief on' : 'M belief off');
  if (dbg._last !== D) { dbg._last = D; dbg.innerHTML = D; }

  if (UI.msgT > 0 && UI.msg) {
    msg.style.display = 'block';
    if (msg._last !== UI.msg) { msg._last = UI.msg; msg.innerHTML = UI.msg; }
  } else if (msg.style.display !== 'none') msg.style.display = 'none';
}
const pad = (n) => (n < 10 ? '0' + n : '' + n);

function promptText() {
  if (!P || !W || !GAME || GAME.state !== 'play') return '';
  for (const c of W.containers) {
    const cw = c.w || 1;
    if (c.z === P.z && P.x > c.tx - 1 && P.x < c.tx + cw + 1 && P.y > c.ty - 1 && P.y < c.ty + 2) {
      return 'E — ' + (c.done ? c.label + ' (empty)' : 'search the ' + c.label);
    }
  }
  const it = nearestLooseItem();
  if (it) return 'G — pick up the ' + it.k;
  if (W.secret.z === P.z && dst(P.x, P.y, W.secret.x, W.secret.y) < 1.9) return 'E — the SECRET';
  const fx = Math.floor(P.x + Math.cos(P.a) * 0.75), fy = Math.floor(P.y + Math.sin(P.a) * 0.75);
  const d = doorAt(P.z, fx, fy);
  if (d) {
    if (d.kind === 'cellar') return d.closed ? (P.keys.red ? 'E — unlock the vault' : 'E — locked (red key)') : 'E — vault open';
    if (d.kind === 'lock') return d.closed ? (P.keys.pick ? 'E — pick the study lock' : 'E — locked (lockpick)') : 'E — study open';
    return d.closed ? 'E — open the door' : 'E — close the door';
  }
  const t = T(P.z, fx, fy);
  if (t === 'W') return 'E — climb through the window';
  if (t === 'w') return 'E — climb through the broken window';
  if (t === 'X') return 'boarded up';
  if (stairsHere()) return 'E — ' + (P.z === 0 ? 'go upstairs' : 'go downstairs');
  if (P.hidden) return 'E — come out';
  return '';
}

function stairsHere() {
  if (!W) return false;
  return !!(stairFrom(P.z, P.x | 0, P.y | 0));
}

/* ------------------------------------------------------------- the menu */
function drawMenu(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, CVH);
  g.addColorStop(0, '#0b1018');
  g.addColorStop(1, '#131a24');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CVW, CVH);
  if (W) { // a small plain map of the house as a backdrop
    ctx.save();
    ctx.globalAlpha = 0.18;
    const S = 11;
    ctx.translate(CVW / 2 - (HOUSE.x + HOUSE.w / 2) * S, CVH / 2 - (HOUSE.y + HOUSE.h / 2) * S);
    for (let y = HOUSE.y; y < HOUSE.y + HOUSE.h; y++) for (let x = HOUSE.x; x < HOUSE.x + HOUSE.w; x++) {
      const c = W.floors[0].G[y] && W.floors[0].G[y][x];
      ctx.fillStyle = c === '#' ? '#3a4553' : c === 'D' ? '#8a5a2b' : '#7b8fa3';
      ctx.fillRect(x * S, y * S, S - 0.6, S - 0.6);
    }
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, CVW, CVH);
  const t = performance.now() / 1000;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c14e';
  ctx.font = '700 52px ui-monospace, monospace';
  ctx.fillText('HELLO NEIGHBOUR', CVW / 2, 150 + Math.sin(t) * 2);
  ctx.fillStyle = '#9fb4c9';
  ctx.font = '600 15px ui-monospace, monospace';
  ctx.fillText('2D · one house · two floors · a neighbour who learns', CVW / 2, 182);

  const has = !!storedMatch();
  const items = menuItems(has);
  items.forEach((it, i) => {
    const y = 246 + i * 66;
    const sel = i === MENU.sel;
    ctx.fillStyle = sel ? 'rgba(242,193,78,0.16)' : 'rgba(255,255,255,0.04)';
    roundRect(CVW / 2 - 200, y - 28, 400, 56, 12); ctx.fill();
    if (sel) { ctx.strokeStyle = 'rgba(242,193,78,0.65)'; ctx.lineWidth = 1.4; roundRect(CVW / 2 - 200, y - 28, 400, 56, 12); ctx.stroke(); }
    ctx.fillStyle = it.disabled ? 'rgba(160,176,196,0.35)' : sel ? '#ffe6b0' : '#cfdae8';
    ctx.font = '600 17px ui-monospace, monospace';
    ctx.fillText(it.label, CVW / 2, y - 1);
    if (it.sub) {
      ctx.fillStyle = 'rgba(160,176,196,0.5)';
      ctx.font = '10.5px ui-monospace, monospace';
      ctx.fillText(it.sub, CVW / 2, y + 17);
    }
    MENU.rects[i] = { x: CVW / 2 - 200, y: y - 28, w: 400, h: 56 };
  });
  ctx.fillStyle = 'rgba(160,176,196,0.55)';
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillText('↑↓ select   ENTER play   ·   WASD move   E use   C crouch   SHIFT sprint', CVW / 2, CVH - 40);
  ctx.fillStyle = 'rgba(160,176,196,0.35)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillText('He remembers how you play this match. New Game erases everything he has learned.', CVW / 2, CVH - 20);
  ctx.textAlign = 'left';
}

const MENU = { sel: 0, rects: [] };
function menuItems(has) {
  return [
    { id: 'play', label: has ? 'CONTINUE' : 'PLAY', sub: has ? 'same house, he remembers you' : 'the house, from tonight' },
    { id: 'new', label: 'NEW GAME', sub: 'wipe everything he has learned' },
    { id: 'help', label: 'HOW TO PLAY', sub: 'controls, keys, and the vault' },
  ];
}
function menuKey(code) {
  const items = menuItems(!!storedMatch());
  if (code === 'ArrowUp' || code === 'KeyW') MENU.sel = (MENU.sel + items.length - 1) % items.length;
  else if (code === 'ArrowDown' || code === 'KeyS') MENU.sel = (MENU.sel + 1) % items.length;
  else if (code === 'Enter' || code === 'Space') menuAct(items[MENU.sel].id);
  return true;
}
function menuClick(x, y) {
  const items = menuItems(!!storedMatch());
  for (let i = 0; i < MENU.rects.length; i++) {
    const r = MENU.rects[i];
    if (r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { MENU.sel = i; menuAct(items[i].id); return true; }
  }
  return false;
}
function menuAct(id) {
  if (id === 'play') startMatchFromMenu(false);
  else if (id === 'new') startMatchFromMenu(true);
  else if (id === 'help') { UI.screen = 'help'; }
}

/* --------------------------------------------------------------- screens */
function drawHelp() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1018';
  ctx.fillRect(0, 0, CVW, CVH);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f2c14e';
  ctx.font = '700 26px ui-monospace, monospace';
  ctx.fillText('HOW TO PLAY', 60, 70);
  ctx.fillStyle = '#cfdae8';
  ctx.font = '13px ui-monospace, monospace';
  const rows = [
    'WASD / arrows   move          C  crouch        SHIFT  sprint (loud)',
    'E  use / open / search / stairs        G  pick up / drop',
    'F  throw what you carry at the cursor   H  hide        T  torch',
    'ESC  pause           M  show his belief map        P  pause',
    '',
    'Three keys, no pockets: the lockpick is in the yard shed, the red key',
    'is in the kitchen fridge, the blue key is on the study desk. They live',
    'on your keyring — never in your hands. The vault is in the workshop;',
    'the SECRET is inside it.',
    '',
    'The stairs are in the foyer. Upstairs he sleeps, and the landing lets',
    'you cross the house without the rooms he watches.',
    '',
    'He hears you: running, doors, dropped things, breaking glass. He',
    'investigates, sets traps on the way you keep coming in, and re-locks',
    'what you pick. This match he learns; a New Game forgets it all.',
  ];
  rows.forEach((r, i) => ctx.fillText(r, 60, 110 + i * 22));
  ctx.fillStyle = 'rgba(160,176,196,0.55)';
  ctx.fillText('click or any key to go back', 60, CVH - 40);
}

function drawCut(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, CVH);
  g.addColorStop(0, '#080c13');
  g.addColorStop(1, '#182230');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CVW, CVH);
  const beats = CUTSCENE;
  const dur = 13 / beats.length;
  const i = Math.min(beats.length - 1, Math.floor(UI.cut / dur));
  const local = (UI.cut % dur) / dur;
  const a = Math.min(1, local * 3) * Math.min(1, (1 - local) * 3);
  const b = beats[i];
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c14e';
  ctx.font = '700 30px ui-monospace, monospace';
  wrapText(b.title, CVW / 2, 240, 700, 40);
  ctx.fillStyle = '#cfdae8';
  ctx.font = '14px ui-monospace, monospace';
  wrapText(b.body, CVW / 2, 310, 640, 26);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '12px ui-monospace, monospace';
  ctx.fillText('click or SPACE to skip', CVW / 2, CVH - 40);
  ctx.textAlign = 'left';
}
const CUTSCENE = [
  { title: 'THE HOUSE ON THE HILL', body: 'One house, two floors, one neighbour. Get in, get the keys, get out with what is locked in his vault.' },
  { title: 'THREE KEYS, NO POCKETS', body: 'The lockpick is in the shed. The red key is in the fridge, the blue key on the study desk. They go on your keyring — never in your hands.' },
  { title: 'THE UPSTAIRS', body: 'Stairs in the foyer. He sleeps up there, and the landing lets you cross the house without walking through the rooms he watches.' },
  { title: 'HE IS LEARNING', body: 'He hears your steps, notices what you take, and re-locks what you pick. Caught or not, this match he keeps what he learns. New Game forgets it.' },
];

function wrapText(text, x, y, max, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const wd of words) {
    const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > max) { ctx.fillText(line, x, yy); line = wd; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

function drawPause() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(5,8,12,.75)';
  ctx.fillRect(0, 0, CVW, CVH);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c14e';
  ctx.font = '700 26px ui-monospace, monospace';
  ctx.fillText('PAUSED', CVW / 2, 110);
  ctx.fillStyle = '#cfdae8';
  ctx.font = '13px ui-monospace, monospace';
  const rows = [
    'what he knows about this match',
    '',
    'suspicion       ' + Math.round(M.suspicion || 0) + '/100',
    'catches / wins  ' + M.catches + ' / ' + M.wins,
    'traps · cameras ' + TRAPS.length + ' · ' + CAMS.length,
    'doors noticed   ' + Object.keys(M.entries || {}).length,
    'things taken    ' + (M.thefts || []).length,
    'hiding spots    ' + (M.hides || []).length,
    '',
    'ESC resume  ·  R restart this match  ·  M belief overlay',
  ];
  rows.forEach((r, i) => ctx.fillText(r, CVW / 2, 170 + i * 24));
  ctx.textAlign = 'left';
}

function drawOver() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(5,8,12,.82)';
  ctx.fillRect(0, 0, CVW, CVH);
  const win = UI.over === 'win';
  ctx.textAlign = 'center';
  ctx.fillStyle = win ? '#5fd08a' : '#e2564a';
  ctx.font = '700 40px ui-monospace, monospace';
  ctx.fillText(win ? 'YOU GOT OUT WITH IT' : 'CAUGHT', CVW / 2, 220);
  ctx.fillStyle = '#cfdae8';
  ctx.font = '14px ui-monospace, monospace';
  ctx.fillText(win
    ? 'The SECRET is yours. He will remember how you did it.'
    : 'He walked you back out. He will remember which way you came.', CVW / 2, 268);
  ctx.fillStyle = 'rgba(160,176,196,0.6)';
  ctx.font = '12px ui-monospace, monospace';
  ctx.fillText('ENTER or click — back into the house', CVW / 2, 330);
  ctx.textAlign = 'left';
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

window.__g = GAMEAPI;
boot();
